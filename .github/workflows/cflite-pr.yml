name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths:
      - 'crates/unrar-rs/**'
      - 'crates/par2-rs/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'
      - '.github/workflows/cflite-batch.yml'

permissions:
  contents: read

jobs:
  pr-fuzzing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Five targets share this budget, and a pull request lane is a
          # smoke test for regressions the change itself introduced — the deep
          # search is the nightly batch job's work.
          fuzz-seconds: 600
          mode: code-change
          sanitizer: address
