name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rarpar-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1
  SCCACHE_CACHE_VERSION: v1
  WASM_CACHE_VERSION: v2
  # Pinned: the wasm harness lanes are only comparable with each other if they
  # all executed on the same runtime. Bump deliberately, not incidentally.
  WASMTIME_VERSION: 47.0.3
  # Pinned: the corpus signature is verified by the same cosign release the
  # publish workflow signs with. Bump both together.
  COSIGN_VERSION: v3.1.3

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      crates: ${{ steps.detect.outputs.crates }}
      rarpar: ${{ steps.detect.outputs.rarpar }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect changed areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "crates=true"
              echo "rarpar=true"
              echo "rust=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
                base="$(git rev-parse "${head}^" 2>/dev/null || true)"
              fi
              ;;
            *)
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
              head="HEAD"
              ;;
          esac

          if [ -z "${base:-}" ]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$head" > changed-files.txt
          fi

          crates_direct=false
          rarpar_direct=false
          shared_rust=false

          while IFS= read -r path; do
            case "$path" in
              crates/*|.github/workflows/publish-crates.yml|.gitattributes|.gitleaks.toml|.githooks/*|.github/scripts/*|test-corpus/*|.github/workflows/test-corpus-publish.yml)
                crates_direct=true
                ;;
              tools/rarpar/*|xtask/*|bench/rarpar-bench/*|.github/workflows/release.yml|README.md|docs/*)
                rarpar_direct=true
                ;;
              .github/workflows/ci.yml)
                crates_direct=true
                rarpar_direct=true
                ;;
              Cargo.toml|Cargo.lock|rust-toolchain.toml)
                shared_rust=true
                ;;
            esac
          done < changed-files.txt

          crates="$crates_direct"
          rarpar="$rarpar_direct"

          if [ "$shared_rust" = true ] && [ "$rarpar_direct" = false ]; then
            crates=true
          fi
          if [ "$shared_rust" = true ] && [ "$crates_direct" = false ]; then
            rarpar=true
          fi

          rust=false
          if [ "$crates" = true ] || [ "$rarpar" = true ]; then
            rust=true
          fi

          {
            echo "crates=$crates"
            echo "rarpar=$rarpar"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Change classification"
            echo
            echo "- crates: \`$crates\`"
            echo "- rarpar: \`$rarpar\`"
            echo "- rust: \`$rust\`"
            echo
            echo "Changed files:"
            sed 's/^/- `/' changed-files.txt | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: |
          set -euo pipefail

          # Keep local workstation paths out of public-facing files.
          mac_home_root="/Users"
          linux_home_root="/home"
          windows_home_root='C:\Users'
          personal_path_regex="(${mac_home_root}/[^[:space:]/]+|${linux_home_root}/[^[:space:]/]+|${windows_home_root}\\[^\\[:space:]]+)"
          # The bench fleet ships example configs and their round-trip tests.
          # Every home path in them is a deliberate placeholder for the operator
          # to replace, or the staging root of a remote bench host -- never a
          # local workstation path. The Go tests patch those same literals, so
          # their strings have to match the examples byte for byte. Excluded by
          # path so the regex itself stays strict everywhere else.
          if git grep -n -I -E "$personal_path_regex" -- . \
            ':!.git/**' \
            ':!target/**' \
            ':!bench/fleet.example.toml' \
            ':!bench/rarpar-bench/config/hosts.example.json' \
            ':!bench/rarpar-bench/internal/fleet/fleet_test.go'; then
            echo "::error::tracked files contain local personal paths"
            exit 1
          fi

          # Cargo packages must never include fixture corpora. Every mention of
          # tests/fixtures in a publishable manifest has to sit inside that
          # manifest's exclude list; what else shares the list is not this
          # check's business (the fuzz corpora joined it and the old pattern,
          # which demanded the array end right after the fixtures glob, started
          # reporting correctly-excluded crates).
          if git grep -n 'tests/fixtures' -- crates/*/Cargo.toml | grep -v ':exclude = \[[^]]*"tests/fixtures/\*\*"'; then
            echo "::error::fixture directories must remain excluded from publishable crates"
            exit 1
          fi

          # The corpus left Git LFS when its first published revision was
          # pinned; nothing may quietly bring it back: no attributes file may
          # declare an lfs filter, and no pointer blob may be committed where
          # fixture bytes belong. The patterns are assembled at run time so
          # this file cannot match itself, and the pointer check is scoped to
          # the fixture trees because xtask's own tests legitimately hold
          # pointer literals as test data.
          lfs_filter="filter=""lfs"
          pointer_spec="https://git-lfs.github.com""/spec"
          bad="$(git ls-files -z -- '.gitattributes' '*/.gitattributes' | xargs -0 -r grep -l "$lfs_filter" || true)"
          if [ -n "$bad" ]; then
            echo "::error::an attributes file reintroduces Git LFS:"
            printf '%s\n' "$bad"
            exit 1
          fi
          bad="$(git grep -I --cached -l "$pointer_spec" -- 'crates/*/tests/fixtures' || true)"
          if [ -n "$bad" ]; then
            echo "::error::a Git LFS pointer is committed where fixture bytes belong:"
            printf '%s\n' "$bad"
            exit 1
          fi

  fmt:
    name: fmt
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: clippy
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-clippy-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-clippy-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Run clippy
        # `unstable-internals` is off by default and gates `unrar-rs`'s
        # `__internals` module. Without it the bench and example that name it
        # carry `required-features` cargo cannot satisfy, so `--all-targets`
        # would silently stop linting them.
        run: cargo clippy --locked --workspace --all-targets --features unrar-rs/unstable-internals -- -D warnings
      - name: Check unrar-rs with every feature enabled
        # The publish preflight's cargo-semver-checks and rustdoc build the crate
        # with all features unified, so every feature must stay additive. Catch
        # a conflict at PR time instead of at publish time.
        run: cargo check --locked -p unrar-rs --all-features --all-targets
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  unit-tests:
    name: unit-tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-unit-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-unit-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Hydrate the test corpus (unit)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile unit
      - name: Run no-fixture Rust tests
        # `--features unrar-rs/unstable-internals`: see the clippy lane. Without
        # it the `probe_volumes` example is skipped rather than compiled.
        run: cargo test --locked --workspace --lib --bins --examples --no-fail-fast --features unrar-rs/unstable-internals
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  # The aarch64-only cfg surface (NEON kernels, the blake2 leaf-group API) is
  # invisible to the x86 clippy lane; -D warnings only gates what it compiles.
  clippy-aarch64:
    name: clippy-aarch64
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-clippy-arm-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-clippy-arm-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Run clippy
        # `unstable-internals` is off by default and gates `unrar-rs`'s
        # `__internals` module. Without it the bench and example that name it
        # carry `required-features` cargo cannot satisfy, so `--all-targets`
        # would silently stop linting them.
        run: cargo clippy --locked --workspace --all-targets --features unrar-rs/unstable-internals -- -D warnings
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  fixture-tests:
    name: fixture-tests
    needs: [changes, fmt, clippy, clippy-aarch64, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-fixtures-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-fixtures-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Hydrate the test corpus (unrar, par2)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile unrar --profile par2
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the corpus against its ledger, lock and signature
        run: cargo run --locked -p xtask -- test-corpus verify --all-present --require-signature
      - name: Run the workspace fixture tests outside unrar-rs and par2-rs
        run: |
          set -euo pipefail

          # `unrar-rs` and `par2-rs` are deliberately NOT here: each of those
          # crates runs its complete suite exactly once, in `unrar-tests` and
          # `par2-tests` respectively (with `slow-tests` on, and with the UnRAR
          # oracle installed for unrar-rs). Running them here as well used to
          # cost a second full pass over the two heaviest suites in the
          # workspace on every CI run. What remains is everything else that
          # needs the hydrated corpora — chiefly the `rarpar` CLI suite, which
          # extracts fixtures from both — plus reedsolomon-rs, xtask, and their
          # doctests.
          #
          # cargo only *warns* about an `--exclude` name that no longer matches
          # (a rename would silently turn this back into a second full pass over
          # that crate), whereas the crate lanes' `-p` hard-errors. Pin both
          # names first so a rename fails here too instead of just getting slow.
          cargo pkgid unrar-rs >/dev/null
          cargo pkgid par2-rs >/dev/null
          cargo test --locked --workspace --no-fail-fast \
            --exclude unrar-rs \
            --exclude par2-rs
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  par2-tests:
    name: par2-tests
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-par2-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-par2-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Hydrate the test corpus (par2)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile par2
      - name: Run the par2-rs suite
        run: |
          set -euo pipefail

          # The whole crate, once: lib, every `tests/` target, and doctests.
          # `fixture-tests` excludes par2-rs, so nothing here is a repeat.
          # `--features slow-tests` brings the gated coverage along in the same
          # build and the same pass — the three fully-gated targets
          # (`real_world_generated`, `repair_stress`,
          # `par2cmdline_turbo_functional`) and the two gated unit tests inside
          # `src/repairer.rs` — instead of a second, separately-compiled lane.
          # A feature name that stops existing is a hard cargo error, not a
          # silent zero.
          cargo test --locked -p par2-rs --features slow-tests --no-fail-fast
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  # The slow unrar suite, one runner per shard. Fixtures are never produced
  # here: generation happens exactly once, inside the signed
  # test-corpus-publish workflow, and every other lane — these shards included
  # — downloads the published, signed blobs and verifies them (every object
  # digest against the pinned manifest, and the manifest's Sigstore bundle
  # against the publish workflow's identity). What the shards add is
  # multiplexing: nextest partitions the whole suite across three runners, so
  # the lane's wall time is the slowest third rather than the sum.
  unrar-tests-shard:
    name: unrar-tests (${{ matrix.shard }}/3)
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # One shard's failure is a third of the suite; the other two thirds are
      # still worth knowing about.
      fail-fast: false
      # Shards are assigned by *measured* time, not by test count. Counting
      # tests split this suite 1810 s / 320 s / 330 s of work, because the
      # cost is nowhere near uniform: from run 32079063363, the whole
      # 2460 s divides across binaries as
      #
      #     failure_paths  690 s   integration  550 s   lib          540 s
      #     imported_corpus 343 s  api_parity   149 s   wasm_*       150 s
      #     everything else  38 s
      #
      # so the split below is a bin-pack of those weights: ~839 s / ~893 s /
      # ~729 s. Shard 3 is written as the complement, so a test binary added
      # later still runs somewhere without anyone remembering this list.
      #
      # Re-derive after a large change: take a green run's log and total the
      # `PASS [ … s]` lines per binary
      # (`gh run view <id> --log | grep 'unrar-tests'`).
      matrix:
        include:
          - shard: 1
            filter: binary(failure_paths) + binary(api_parity)
          - shard: 2
            filter: binary(integration) + binary(imported_corpus)
          - shard: 3
            filter: >-
              not (binary(failure_paths) + binary(api_parity)
              + binary(integration) + binary(imported_corpus))
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SHARD: ${{ matrix.shard }}
      SHARD_FILTER: ${{ matrix.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Install the UnRAR oracle
        run: |
          set -euo pipefail

          # RARLAB's unrar is freeware under RARLAB's own UnRAR license: free to
          # use and redistribute, but the source may not be used to re-create
          # the RAR compressor. It is therefore installed from Ubuntu's
          # multiverse component at job time and never vendored into this repo.
          # Installing it from apt keeps the oracle off any extra network
          # surface: this job already depends on apt for mold and nasm.
          sudo apt-get install -y --no-install-recommends unrar

          unrar_bin="$(command -v unrar)"
          # Ubuntu also carries `unrar-free`, an unrelated implementation that
          # would be a worthless differential oracle. Refuse anything that does
          # not identify itself as RARLAB's UnRAR.
          banner="$("$unrar_bin" 2>&1 | head -n 5 || true)"
          if ! printf '%s\n' "$banner" | grep -qE '^UNRAR .* freeware'; then
            echo "::error::$unrar_bin is not RARLAB UnRAR"
            printf '%s\n' "$banner"
            exit 1
          fi
          printf '%s\n' "$banner" | grep -E '^UNRAR .* freeware'

          {
            echo "UNRAR_BIN=$unrar_bin"
            # WEAVER_REQUIRE_UNRAR_ORACLE must be set wherever UNRAR_BIN is, so
            # that a missing binary fails the job instead of silently skipping
            # every oracle comparison.
            echo "WEAVER_REQUIRE_UNRAR_ORACLE=1"
          } >> "$GITHUB_ENV"
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-unrar-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-unrar-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Hydrate the test corpus
        # Both profiles, not just unrar: the whole-tree verify below is what
        # proves the download, and it must hold on any checkout — with the
        # legacy LFS pointers still present beside the hydrated files, or
        # after their removal. Hydrating everything makes the guarantee
        # independent of that ordering, and the extra profile costs seconds
        # (the egress is free and the objects are digest-deduplicated).
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile unrar --profile par2
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify the corpus and the manifest signature
        run: |
          set -euo pipefail
          # Every ledger path present with the pinned digest, and the published
          # manifest's Sigstore bundle valid under the publish workflow's
          # identity. The shards never produce a fixture; this step is what
          # entitles them to read these.
          cargo run --locked -p xtask -- test-corpus verify --require-signature --all-present
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Run this shard of the unrar-rs suite
        run: |
          set -euo pipefail

          # This shard's slice of the crate, selected by test binary (see the
          # weights on the matrix above). Shard 3 is the complement of the
          # other two, so the three filters partition the suite exactly: no
          # test runs twice, and none is dropped when a binary is added.
          #
          # This is the only lane that installs RARLAB's unrar, so the oracle
          # differentials run here with UNRAR_BIN set rather than skipping
          # themselves as they do everywhere else.
          #
          # `--features slow-tests` brings the gated coverage along in the
          # same build: the five targets that are `#![cfg(feature =
          # "slow-tests")]` in their entirety. A feature name that stops
          # existing is a hard cargo error, not a silent zero.
          cargo nextest run --locked -p unrar-rs --features slow-tests \
            --no-fail-fast -E "$SHARD_FILTER"
      - name: Run the doctests (shard 1 carries them)
        if: ${{ matrix.shard == 1 }}
        run: |
          set -euo pipefail
          # nextest does not run doctests; the old single lane did. One shard
          # keeps them so the suite loses nothing in the split.
          cargo test --locked -p unrar-rs --features slow-tests --doc
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && matrix.shard == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  # The check name `unrar-tests` is load-bearing: branch protection and the
  # publish-crates preflight both require it by exact name. This join is that
  # name — green iff every shard is.
  unrar-tests:
    name: unrar-tests
    needs: [changes, unrar-tests-shard]
    if: ${{ always() && needs.changes.outputs.crates == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard green
        env:
          RESULT: ${{ needs.unrar-tests-shard.result }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != "success" ]; then
            echo "::error::the unrar shards concluded: $RESULT"
            exit 1
          fi
          echo "all unrar shards passed"

  platform-tests:
    name: platform-tests-${{ matrix.platform }}
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
          - platform: darwin-arm64
            runs_on: macos-26
          - platform: darwin-x86_64
            runs_on: macos-26-intel
          - platform: windows-x86_64
            runs_on: windows-2025-vs2026
          - platform: windows-arm64
            runs_on: windows-11-arm
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - name: Install NASM (macOS)
        if: matrix.platform == 'darwin-x86_64'
        run: brew install nasm
      - name: Install NASM (Windows x86_64)
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-platform-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-platform-${{ matrix.platform }}-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-platform-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Configure compiler flags (Unix)
        if: runner.os != 'Windows'
        run: |
          {
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
              echo "CC=sccache cc"
              echo "CXX=sccache c++"
            else
              echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=."
              echo "CC=sccache clang"
              echo "CXX=sccache clang++"
            fi
          } >> "$GITHUB_ENV"
      - name: Configure compiler flags (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=." | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Prime sccache server
        shell: bash
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Hydrate the test corpus (unit)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile unit
      - name: Run platform unit tests
        run: cargo test --locked --workspace --lib --bins --no-fail-fast
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  target-checks:
    name: target-checks-${{ matrix.platform }}
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true' || needs.changes.outputs.rarpar == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64-gnu-direct
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: runtime
          - platform: linux-x86_64-musl-direct
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            features: runtime
          - platform: linux-arm64-gnu-direct
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: runtime
          - platform: linux-arm64-musl-direct
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            features: runtime
          - platform: darwin-arm64
            runs_on: macos-26
            target: aarch64-apple-darwin
            features: runtime,metal
          - platform: darwin-x86_64
            runs_on: macos-26-intel
            target: x86_64-apple-darwin
            features: runtime
          - platform: windows-x86_64
            runs_on: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            features: runtime
          - platform: windows-arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: runtime
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          packages=(mold)
          case "$TARGET" in
            x86_64-*) packages+=(nasm) ;;
          esac
          case "$TARGET" in
            *-musl) packages+=(musl-tools) ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Install NASM (macOS)
        if: matrix.platform == 'darwin-x86_64'
        run: brew install nasm
      - name: Install NASM (Windows x86_64)
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-target-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-target-${{ matrix.platform }}-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-target-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Configure compiler flags (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          {
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold"
              case "${{ matrix.target }}" in
                *-musl)
                  target_env="${{ matrix.target }}"
                  target_env="${target_env//-/_}"
                  printf 'CC_%s=%s\n' "$target_env" "sccache musl-gcc"
                  ;;
                *)
                  echo "CC=sccache cc"
                  echo "CXX=sccache c++"
                  ;;
              esac
            else
              echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=."
              echo "CC=sccache clang"
              echo "CXX=sccache clang++"
            fi
          } >> "$GITHUB_ENV"
      - name: Configure compiler flags (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=." | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Prime sccache server
        shell: bash
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Check release target features
        run: >-
          cargo check --locked -p rarpar --no-default-features
          --features ${{ matrix.features }} --target ${{ matrix.target }}
      - name: Audit release target features
        run: >-
          cargo run --locked -p xtask -- feature-audit
          --manifest tools/rarpar/Cargo.toml --target ${{ matrix.target }}
          --features ${{ matrix.features }}
      - name: Check workspace target
        run: cargo check --locked --workspace --all-targets --target ${{ matrix.target }}
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  package:
    name: package
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-package-${{ github.run_id }}
          restore-keys: |
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-package-
            gha-sccache-${{ env.SCCACHE_CACHE_VERSION }}-rarpar-ci-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      - name: Verify package contents
        run: |
          set -euo pipefail
          mkdir -p .ci/package-lists

          registry_has_version() {
            local tmp rc
            tmp="$(mktemp -d)"
            if (
              cd "$tmp"
              cargo info "$1@$2" >/dev/null 2>&1
            ); then
              rc=0
            else
              rc=$?
            fi
            rm -rf "$tmp"
            return "$rc"
          }

          manifest_for_crate() {
            case "$1" in
              reedsolomon-rs) echo "crates/reedsolomon-rs/Cargo.toml" ;;
              unrar-rs) echo "crates/unrar-rs/Cargo.toml" ;;
              par2-rs) echo "crates/par2-rs/Cargo.toml" ;;
              *) echo "unknown crate: $1" >&2; return 1 ;;
            esac
          }

          verify_fixture_exclude() {
            crate="$1"
            case "$crate" in
              unrar-rs|par2-rs)
                python3 - "$(manifest_for_crate "$crate")" "$crate" <<'PY'
          import pathlib
          import sys
          import tomllib

          manifest = pathlib.Path(sys.argv[1])
          crate = sys.argv[2]
          data = tomllib.loads(manifest.read_text())
          excludes = data.get("package", {}).get("exclude", [])
          if "tests/fixtures/**" not in excludes:
              print(
                  f"{crate} manifest must exclude tests/fixtures/**",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
                ;;
            esac
          }

          exact_packaged_crates=""
          package_and_list() {
            crate="$1"
            cargo package --locked -p "$crate"
            cargo package --locked --list -p "$crate" > ".ci/package-lists/${crate}.txt"
            if grep -n 'tests/fixtures' ".ci/package-lists/${crate}.txt"; then
              echo "::error::${crate} package includes fixture files"
              exit 1
            fi
            if [ "$crate" = unrar-rs ]; then
              grep -Fxq LICENSE ".ci/package-lists/${crate}.txt"
            fi
            exact_packaged_crates="${exact_packaged_crates} ${crate}"
          }

          read -r reed_version unrar_version _ < <(python3 - <<'PY'
          import json
          import subprocess

          metadata = json.loads(
              subprocess.check_output([
                  "cargo",
                  "metadata",
                  "--locked",
                  "--format-version",
                  "1",
                  "--no-deps",
              ])
          )
          versions = {
              package["name"]: package["version"]
              for package in metadata["packages"]
          }
          print(
              versions["reedsolomon-rs"],
              versions["unrar-rs"],
              versions["par2-rs"],
          )
          PY
          )

          package_and_list reedsolomon-rs

          if registry_has_version reedsolomon-rs "$reed_version"; then
            package_and_list unrar-rs
          else
            echo "unrar-rs exact package check deferred until reedsolomon-rs@$reed_version is published"
            verify_fixture_exclude unrar-rs
          fi

          if registry_has_version reedsolomon-rs "$reed_version" \
            && registry_has_version unrar-rs "$unrar_version"; then
            package_and_list par2-rs
          else
            echo "par2-rs exact package check deferred until same-release dependencies are published"
            verify_fixture_exclude par2-rs
          fi

          export EXACT_PACKAGED_CRATES="$exact_packaged_crates"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          limits = {
              "reedsolomon-rs": 1_000_000,
              "unrar-rs": 2_500_000,
              "par2-rs": 2_500_000,
          }
          exact_packaged_crates = os.environ["EXACT_PACKAGED_CRATES"].split()
          limits = {crate: limits[crate] for crate in exact_packaged_crates}
          metadata = json.loads(
              subprocess.check_output([
                  "cargo",
                  "metadata",
                  "--locked",
                  "--format-version",
                  "1",
                  "--no-deps",
              ])
          )
          versions = {
              package["name"]: package["version"]
              for package in metadata["packages"]
              if package["name"] in limits
          }
          if not limits:
              print("no exact .crate archives were produced", file=sys.stderr)
              sys.exit(1)

          package_dir = pathlib.Path("target/package")
          failed = False
          for crate, limit in limits.items():
              path = package_dir / f"{crate}-{versions.get(crate)}.crate"
              if not path.exists():
                  print(f"missing packaged crate for {crate} {versions.get(crate)}", file=sys.stderr)
                  failed = True
                  continue
              size = path.stat().st_size
              print(f"{path.name}: {size} bytes")
              if size > limit:
                  print(
                      f"{crate} package is {size} bytes, over {limit} byte limit",
                      file=sys.stderr,
                  )
                  failed = True
          if failed:
              sys.exit(1)
          PY
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: ${{ always() && steps.sccache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

