  # The wasm correctness harnesses. Both crates ship an example that runs the
  # real code over the real fixtures and prints a digest per case; until now
  # only the wasm *targets* were installed in CI and nothing ever executed
  # them. Each job runs the harness natively first and treats that run's
  # digests as the expectation for every wasm lane in the same job, so no
  # digest is ever hardcoded here: a fixture change moves the reference and the
  # lanes together, while a lane that decodes different bytes still fails.
  wasm-par2-harness:
    name: wasm-par2-harness
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # One CARGO_TARGET_DIR per (target, RUSTFLAGS) pair: cargo fingerprints
      # do not separate builds by RUSTFLAGS, so sharing a directory between the
      # portable and +simd128 lanes would rebuild the world on every switch.
      WASM_LANES: ${{ github.workspace }}/target-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - name: Install native build dependencies
        run: |
          # Only the native reference build needs these: building an example
          # compiles the crate's dev-dependencies, and par2-rs depends (for
          # non-wasm targets only) on unrar-rs with its AWS-LC backend, which
          # brings in aws-lc-sys. The wasm lanes compile none of it -- those
          # dev-dependencies are target-gated off wasm.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
      - name: Hydrate the test corpus (par2)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile par2
      - name: Restore wasm lane target directories
        id: wasm-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Only the wasm lanes are cached. The native reference build pulls in
          # this crate's native-only dev-dependencies and is an order of
          # magnitude larger for no reuse benefit.
          path: |
            ${{ github.workspace }}/target-wasm/wasip1-portable
            ${{ github.workspace }}/target-wasm/wasip1-simd128
            ${{ github.workspace }}/target-wasm/threads-portable
            ${{ github.workspace }}/target-wasm/threads-simd128
          key: gha-wasm-${{ env.WASM_CACHE_VERSION }}-rarpar-par2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            gha-wasm-${{ env.WASM_CACHE_VERSION }}-rarpar-par2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}-
            gha-wasm-${{ env.WASM_CACHE_VERSION }}-rarpar-par2-${{ env.RUST_TOOLCHAIN }}-
      - name: Set up wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - name: Verify the pinned wasmtime is the one on PATH
        run: |
          set -euo pipefail
          wasmtime --version
          # The lanes are only comparable against each other if they all ran on
          # the same runtime, so assert the pin rather than trusting that the
          # setup action resolved the requested version.
          wasmtime --version | grep -qF "wasmtime $WASMTIME_VERSION"
      - name: Build the PAR2 harness for every lane
        run: |
          set -euo pipefail
          build_lane() {
            local lane="$1" target="$2" flags="$3"
            # Empty for the native build. The `${a[@]+...}` form is what keeps
            # expanding an empty array legal under `set -u`.
            local -a target_arg=()
            if [ -n "$target" ]; then
              target_arg=(--target "$target")
            fi
            echo "::group::build $lane (${target:-native}) RUSTFLAGS=\"$flags\""
            CARGO_TARGET_DIR="$WASM_LANES/$lane" RUSTFLAGS="$flags" \
              cargo build --release --locked -p par2-rs --no-default-features \
                ${target_arg[@]+"${target_arg[@]}"} --example wasm_par2_check
            echo "::endgroup::"
          }
          # --no-default-features throughout: it drops the aws-lc-sys MD5
          # backend, which cannot build for wasm at all, and keeps the native
          # reference feature-identical to the lanes it is the control for.
          build_lane native           ""                    ""
          build_lane wasip1-portable  wasm32-wasip1         ""
          build_lane wasip1-simd128   wasm32-wasip1         "-C target-feature=+simd128"
      - name: Run the PAR2 harness natively, then on every wasm lane
        run: |
          set -euo pipefail
          fixtures="$PWD/crates/par2-rs/tests/fixtures"
          check="$PWD/.github/scripts/wasm-harness-check.sh"
          reports="$RUNNER_TEMP/par2-reports"
          mkdir -p "$reports"

          # The native reference. `wasm-harness-check.sh` fails the job here if
          # the report is missing any case, if a reconstruction case did not
          # actually reconstruct, or if a readback came back short -- so a
          # broken or silently-empty reference can never become the standard
          # the wasm lanes are then trivially "equal" to.
          echo "::group::lane native (reference)"
          rm -rf "$RUNNER_TEMP/scratch-native"
          mkdir -p "$RUNNER_TEMP/scratch-native"
          "$WASM_LANES/native/release/examples/wasm_par2_check" \
            "$fixtures" "$RUNNER_TEMP/scratch-native" | tee "$reports/native.txt"
          "$check" par2 "$reports/native.txt" "$reports/native.canon"
          rm -rf "$RUNNER_TEMP/scratch-native"
          echo "::endgroup::"

          results=()
          failures=0
          run_lane() {
            local name="$1" wasm="$2"
            shift 2
            local scratch="$RUNNER_TEMP/scratch-$name"
            rm -rf "$scratch"
            mkdir -p "$scratch"
            echo "::group::lane $name"
            local status=PASS
            # Each lane must (1) exit clean, (2) pass the same non-vacuous case
            # assertions as native, and (3) produce a byte-identical canonical
            # report -- which is where the digests are actually compared.
            if wasmtime run "$@" \
                 --dir "$fixtures::/fixtures" --dir "$scratch::/scratch" \
                 "$wasm" /fixtures /scratch | tee "$reports/$name.txt" \
               && "$check" par2 "$reports/$name.txt" "$reports/$name.canon" \
               && diff -u "$reports/native.canon" "$reports/$name.canon"; then
              echo "lane $name: canonical report is identical to native"
            else
              status=FAIL
              failures=$((failures + 1))
              echo "::error::wasm lane $name diverged from the native reference run"
            fi
            # Each lane's scratch peaks around 600 MiB of fixture copies.
            rm -rf "$scratch"
            results+=("$name|$status")
            echo "::endgroup::"
          }

          w1="$WASM_LANES/wasip1-portable/wasm32-wasip1/release/examples/wasm_par2_check.wasm"
          w1s="$WASM_LANES/wasip1-simd128/wasm32-wasip1/release/examples/wasm_par2_check.wasm"

          run_lane wasip1-portable "$w1"
          run_lane wasip1-simd128 "$w1s"
          # No wasm32-wasip1-threads lanes, by decision (2026-08-13): the
          # production host runs wasmtime 47, which removed wasi-threads and
          # wasi-common outright (RELEASES.md 47.0.0), so threads-target
          # modules fail to instantiate there ("unknown import: `env::memory`")
          # and no flag restores them. The MT wasm code stays in-tree behind
          # its runtime thread-capability probe (inert on wasip1) with native
          # test coverage; revisit these lanes when a runtime ships
          # shared-everything-threads or an equivalent ABI.

          {
            echo "### wasm PAR2 harness"
            echo
            echo "wasmtime $WASMTIME_VERSION; digests compared against the native run in this job."
            echo
            echo "| lane | result |"
            echo "| --- | --- |"
            for entry in "${results[@]}"; do
              echo "| ${entry%%|*} | ${entry##*|} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures wasm PAR2 lane(s) failed"
            exit 1
          fi
      - name: Save wasm lane target directories
        if: ${{ always() && steps.wasm-cache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/target-wasm/wasip1-portable
            ${{ github.workspace }}/target-wasm/wasip1-simd128
            ${{ github.workspace }}/target-wasm/threads-portable
            ${{ github.workspace }}/target-wasm/threads-simd128
          key: ${{ steps.wasm-cache-restore.outputs.cache-primary-key }}

  wasm-unrar-harness:
    name: wasm-unrar-harness
    needs: [changes, fmt, clippy, unit-tests]
    if: needs.changes.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WASM_LANES: ${{ github.workspace }}/target-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - name: Hydrate the test corpus (wasm-unrar)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile wasm-unrar
      - name: Restore wasm lane target directories
        id: wasm-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/target-wasm/wasip1-portable
            ${{ github.workspace }}/target-wasm/wasip1-simd128
          key: gha-wasm-${{ env.WASM_CACHE_VERSION }}-rarpar-unrar-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            gha-wasm-${{ env.WASM_CACHE_VERSION }}-rarpar-unrar-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}-
            gha-wasm-${{ env.WASM_CACHE_VERSION }}-rarpar-unrar-${{ env.RUST_TOOLCHAIN }}-
      - name: Set up wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - name: Verify the pinned wasmtime is the one on PATH
        run: |
          set -euo pipefail
          wasmtime --version
          wasmtime --version | grep -qF "wasmtime $WASMTIME_VERSION"
      - name: Build the UnRAR harness for every lane
        run: |
          set -euo pipefail
          build_lane() {
            local lane="$1" target="$2" flags="$3"
            # Empty for the native build. The `${a[@]+...}` form is what keeps
            # expanding an empty array legal under `set -u`.
            local -a target_arg=()
            if [ -n "$target" ]; then
              target_arg=(--target "$target")
            fi
            echo "::group::build $lane (${target:-native}) RUSTFLAGS=\"$flags\""
            CARGO_TARGET_DIR="$WASM_LANES/$lane" RUSTFLAGS="$flags" \
              cargo build --release --locked -p unrar-rs --no-default-features \
                --features crypto-rust ${target_arg[@]+"${target_arg[@]}"} --example wasm_extract_check
            echo "::endgroup::"
          }
          # crypto-rust is the only backend that builds for wasm (the default
          # aws-lc backend does not), so the native reference is built with it
          # too: the point of that run is to be a like-for-like control.
          build_lane native          ""            ""
          build_lane wasip1-portable wasm32-wasip1 ""
          build_lane wasip1-simd128  wasm32-wasip1 "-C target-feature=+simd128"
      - name: Run the UnRAR harness natively, then on every wasm lane
        run: |
          set -euo pipefail
          fixtures="$PWD/crates/unrar-rs/tests/fixtures"
          check="$PWD/.github/scripts/wasm-harness-check.sh"
          reports="$RUNNER_TEMP/unrar-reports"
          mkdir -p "$reports"

          echo "::group::lane native (reference)"
          "$WASM_LANES/native/release/examples/wasm_extract_check" "$fixtures" \
            | tee "$reports/native.txt"
          "$check" unrar "$reports/native.txt" "$reports/native.canon"
          echo "::endgroup::"

          results=()
          failures=0
          run_lane() {
            local name="$1" wasm="$2"
            local guest_tmp="$RUNNER_TEMP/tmp-$name"
            rm -rf "$guest_tmp"
            mkdir -p "$guest_tmp"
            echo "::group::lane $name"
            local status=PASS
            # The /tmp preopen matches the invocation documented on the
            # harness; the spool never reaches it on wasm (WASI preview1 has no
            # usable temp dir), which `wasm-harness-check.sh` asserts.
            if wasmtime run --dir "$fixtures::/fixtures" --dir "$guest_tmp::/tmp" \
                 --env TMPDIR=/tmp "$wasm" /fixtures | tee "$reports/$name.txt" \
               && "$check" unrar "$reports/$name.txt" "$reports/$name.canon" \
               && diff -u "$reports/native.canon" "$reports/$name.canon"; then
              echo "lane $name: canonical report is identical to native"
            else
              status=FAIL
              failures=$((failures + 1))
              echo "::error::wasm lane $name diverged from the native reference run"
            fi
            rm -rf "$guest_tmp"
            results+=("$name|$status")
            echo "::endgroup::"
          }

          run_lane wasip1-portable \
            "$WASM_LANES/wasip1-portable/wasm32-wasip1/release/examples/wasm_extract_check.wasm"
          run_lane wasip1-simd128 \
            "$WASM_LANES/wasip1-simd128/wasm32-wasip1/release/examples/wasm_extract_check.wasm"

          {
            echo "### wasm UnRAR harness"
            echo
            echo "wasmtime $WASMTIME_VERSION; digests compared against the native run in this job."
            echo
            echo "| lane | result |"
            echo "| --- | --- |"
            for entry in "${results[@]}"; do
              echo "| ${entry%%|*} | ${entry##*|} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures wasm UnRAR lane(s) failed"
            exit 1
          fi
      - name: Save wasm lane target directories
        if: ${{ always() && steps.wasm-cache-restore.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ github.workspace }}/target-wasm/wasip1-portable
            ${{ github.workspace }}/target-wasm/wasip1-simd128
          key: ${{ steps.wasm-cache-restore.outputs.cache-primary-key }}

  ci-complete:
    name: ci-complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - hygiene
      - fmt
      - clippy
      - unit-tests
      - fixture-tests
      - par2-tests
      - unrar-tests
      - platform-tests
      - target-checks
      - package
      - docs-package
      - cli-smoke
      - wasm-par2-harness
      - wasm-unrar-harness
    steps:
      - name: Check CI result
        run: |
          if [ '${{ contains(needs.*.result, 'failure') }}' = 'true' ] || [ '${{ contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            echo "::error::one or more CI jobs failed"
            exit 1
          fi
          echo "all CI jobs passed"
