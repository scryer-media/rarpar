name: test-corpus-publish

# Publishes one revision of the signed, content-addressed test corpus to R2
# and mirrors the toolchain source archives. Manual, main-only, protected:
# this is the only workflow that holds R2 write credentials, and running it is
# an operator decision. It never creates a branch, commit or pull request —
# pinning the published manifest in test-corpus/lock.json is a reviewed PR.
#
# The corpus is **generated**, never carried forward: the run builds the pinned
# toolchain images, runs every checked-in recipe against them, and fetches every
# upstream import at its pinned commit. Nothing comes out of Git LFS, and the
# suites are run against the tree that was just produced before any of it is
# published.
#
# See docs/test-corpus.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing a corpus revision from main'
        required: true
        type: string
      dry_run:
        description: 'Generate, verify, validate, build and sign, but upload nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: test-corpus-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every fixture byte in this run is produced by a recipe or fetched from a
  # pinned upstream, so the checkout never needs the LFS payloads: the pointers
  # it leaves behind are overwritten before anything reads them.
  GIT_LFS_SKIP_SMUDGE: "1"
  RUST_TOOLCHAIN: 1.97.1
  # Pinned: signature bundles are only comparable if every publication used the
  # same signer. Bump deliberately.
  COSIGN_VERSION: v3.1.3

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    # Image builds + generation + the three suites (the unrar-rs suite alone is
    # budgeted 120 minutes in ci.yml) do not fit in the old 180.
    timeout-minutes: 300
    # The protected environment holds the R2 secrets and gates the run on its
    # reviewers; the corpus variables live beside it.
    environment: test-corpus-publish
    permissions:
      contents: read
      # Keyless cosign: the workflow's OIDC identity is what signs the manifest,
      # provenance and mirrored tool archives.
      id-token: write
    env:
      # Public-read side (also recorded in test-corpus/lock.json) and the
      # bucket name: plain variables. The S3 endpoint and the S3 credential
      # pair for the corpus bucket: secrets, exported straight into the
      # environment the two publishers read; nothing is derived or echoed.
      R2_CORPUS_BUCKET: ${{ vars.R2_CORPUS_BUCKET }}
      R2_CORPUS_PUBLIC_URL: ${{ vars.R2_CORPUS_PUBLIC_URL }}
      R2_CORPUS_S3_ENDPOINT: ${{ secrets.R2_CORPUS_ENDPOINT }}
      R2_CORPUS_ACCESS_KEY_ID: ${{ secrets.R2_CORPUS_S3_ACCESS_KEY }}
      R2_CORPUS_SECRET_ACCESS_KEY: ${{ secrets.R2_CORPUS_S3_SECRET }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Refuse anything but a confirmed run from main
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::the corpus is published from refs/heads/main only (got $REF)"
            exit 1
          fi
          if [ "$CONFIRM" != "publish" ]; then
            echo "::error::type \"publish\" in the confirm input to run this workflow"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            for name in R2_CORPUS_BUCKET R2_CORPUS_PUBLIC_URL; do
              if [ -z "${!name:-}" ]; then
                echo "::error::repository/environment variable $name is not set"
                exit 1
              fi
            done
            for name in R2_CORPUS_S3_ENDPOINT R2_CORPUS_ACCESS_KEY_ID R2_CORPUS_SECRET_ACCESS_KEY; do
              if [ -z "${!name:-}" ]; then
                echo "::error::secret for $name (R2_CORPUS_ENDPOINT / R2_CORPUS_S3_ACCESS_KEY / R2_CORPUS_S3_SECRET) is not available to this run"
                exit 1
              fi
            done
            case "$R2_CORPUS_PUBLIC_URL" in
              https://*) ;;
              *) echo "::error::R2_CORPUS_PUBLIC_URL must be an https URL"; exit 1 ;;
            esac
            case "$R2_CORPUS_S3_ENDPOINT" in
              https://*) ;;
              *) echo "::error::R2_CORPUS_ENDPOINT must be the https S3 endpoint (https://<account>.r2.cloudflarestorage.com)"; exit 1 ;;
            esac
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bench/rarpar-bench/go.mod
          cache-dependency-path: bench/rarpar-bench/go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm

      - name: Validate the shared toolchain lock
        working-directory: bench/rarpar-bench
        run: |
          set -euo pipefail
          go test ./...
          go run ./cmd/rarpar-bench toolchains validate

      # The writers, the encoder and the parity tool the recipes run on. The
      # mirror is read first and falls back to the official URLs when it holds
      # nothing yet; either way each archive has to match the reviewed BLAKE3
      # digest before an image is built from it. The runner is amd64, so the
      # images run natively.
      - name: Build the pinned toolchain images
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- bench toolchains build \
            --mirror-base "${R2_CORPUS_PUBLIC_URL:-}" \
            --cache "$RUNNER_TEMP/tool-cache"

      # The corpus itself: every recipe run on those images, every upstream
      # import fetched at its pinned commit, the produced tree required to be
      # exactly the ledger's path set, and the ledger's sizes and digests
      # refreshed to match. Nothing is carried forward from Git LFS.
      #
      # The recipes are Go (bench/rarpar-bench/internal/testcorpus) and xtask
      # delegates to them, so this step needs the Go toolchain set up above.
      - name: Generate the corpus
        run: cargo run --locked -p xtask -- test-corpus generate --jobs 4

      # Every path present, no blocked provenance, every public upstream import
      # re-fetched byte-identical at its pinned commit.
      - name: Verify the corpus against its ledger and upstreams
        run: cargo run --locked -p xtask -- test-corpus verify --all-present --upstreams

      # The corpus exists to be read by the suites, so the suites are what
      # validates it — against the tree this run produced, not against a
      # remembered one. No UnRAR oracle is configured: the tests that want one
      # skip without UNRAR_BIN.
      - name: Validate the suites against the generated corpus
        run: |
          set -euo pipefail
          cargo test --locked --workspace --no-fail-fast
          cargo test --locked -p unrar-rs --features slow-tests --no-fail-fast
          cargo test --locked -p par2-rs --features slow-tests --no-fail-fast

      - name: Build the manifest and provenance
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- test-corpus build --out target/test-corpus/build
          cat target/test-corpus/build/manifest.blake3

      # Six benchmark cases import a fixture set by digest, so a corpus revision
      # moves those pins. They are SHA-256 — the benchmark corpus's own contract
      # — while everything else here is BLAKE3. The lock-pin PR commits
      # sources.json, lock.json and these corpus.json pins together.
      - name: Recompute the benchmark fixture pins
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- test-corpus bench-pins \
            --out target/test-corpus/build/bench-pins.tsv

      # Original RARLAB and par2cmdline-turbo archives: R2-first, official
      # fallback, reviewed BLAKE3 digest required, signed and conditionally
      # mirrored, read back before anything continues.
      - name: Resolve and mirror the toolchain sources
        working-directory: bench/rarpar-bench
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            go run ./cmd/rarpar-bench toolchains resolve --mirror-base "${R2_CORPUS_PUBLIC_URL:-}"
          else
            go run ./cmd/rarpar-bench toolchains resolve \
              --mirror-base "$R2_CORPUS_PUBLIC_URL" \
              --publish \
              --s3-endpoint "$R2_CORPUS_S3_ENDPOINT" \
              --bucket "$R2_CORPUS_BUCKET"
          fi

      - name: Sign the manifest and provenance
        run: cargo run --locked -p xtask -- test-corpus sign --dir target/test-corpus/build

      - name: Publish objects, manifest, provenance and bundles
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- test-corpus publish \
            --dir target/test-corpus/build \
            --base-url "$R2_CORPUS_PUBLIC_URL" \
            --s3-endpoint "$R2_CORPUS_S3_ENDPOINT" \
            --bucket "$R2_CORPUS_BUCKET"

      - name: Verify the publication from the public side
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # A fresh consumer's view: the lock entry the publish step printed,
          # the manifest it names, its signature, and one profile hydrated
          # into a scratch tree.
          cp target/test-corpus/build/lock.json test-corpus/lock.json
          cargo run --locked -p xtask -- test-corpus verify --require-signature --all-present
          git checkout -- test-corpus/lock.json

      - name: Record the publication
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### test-corpus publish"
            echo
            echo "- ref: \`$GITHUB_REF\` @ \`$GITHUB_SHA\`"
            echo "- dry run: \`$DRY_RUN\`"
            if [ -f target/test-corpus/build/manifest.blake3 ]; then
              echo "- manifest: \`$(cat target/test-corpus/build/manifest.blake3)\`"
            fi
            if [ -f target/test-corpus/build/bench-pins.tsv ]; then
              echo
              echo "Benchmark fixture pins for \`bench/rarpar-bench/config/corpus.json\`:"
              echo
              echo '```'
              cat target/test-corpus/build/bench-pins.tsv
              echo '```'
              echo
              echo "The refreshed \`test-corpus/sources.json\` is in the run artifact; the lock-pin PR commits it with \`lock.json\` and these \`fixture_sha256\` values."
            fi
            if [ -f target/test-corpus/build/lock.json ]; then
              echo
              echo "Pin this in \`test-corpus/lock.json\` through a reviewed PR:"
              echo
              echo '```json'
              cat target/test-corpus/build/lock.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build directory as a run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-corpus-build-${{ github.run_id }}
          path: |
            target/test-corpus/build/manifest.json
            target/test-corpus/build/manifest.blake3
            target/test-corpus/build/manifest.json.sigstore.json
            target/test-corpus/build/provenance.json
            target/test-corpus/build/provenance.json.sigstore.json
            target/test-corpus/build/objects.tsv
            target/test-corpus/build/bench-pins.tsv
            target/test-corpus/build/lock.json
            test-corpus/sources.json
          if-no-files-found: warn
          retention-days: 90
