name: release

on:
  push:
    tags:
      - "rarpar-v*"

concurrency:
  group: rarpar-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  # Nothing builds from a tag this job has not proven was signed by the
  # trusted release identity and cut from the release branch lineage. Same
  # policy and allowed-signers mechanism as the sibling repositories.
  release-trust:
    name: verify-release-tag-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout signed release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify trusted SSH tag signature and release branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            rarpar-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          release_branch="release-${RELEASE_TAG#rarpar-v}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signing/allowed_signers"
          git verify-tag "$RELEASE_TAG"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
          tag_target="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if [ "$tag_target" != "$GITHUB_SHA" ]; then
            echo "release tag no longer matches the triggering commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_target" "origin/$release_branch"; then
            echo "$RELEASE_TAG is not reachable from origin/$release_branch" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$tag_target"; then
            echo "$release_branch must be created from the current origin/main before release" >&2
            exit 1
          fi

  preflight:
    name: preflight
    needs: [release-trust]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: cc
      CXX: c++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm mandoc
      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"rarpar-v(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)", tag)
          if not match:
              print(f"unexpected release tag format: {tag}", file=sys.stderr)
              sys.exit(1)
          expected = match.group(1)
          metadata = subprocess.check_output([
              "cargo",
              "metadata",
              "--locked",
              "--format-version",
              "1",
              "--no-deps",
          ])
          packages = json.loads(metadata)["packages"]
          required = {
              "reedsolomon-rs",
              "unrar-rs",
              "par2-rs",
              "rarpar",
          }
          selected = {
              package["name"]: package["version"]
              for package in packages
              if package["name"] in required
          }
          missing = sorted(required - selected.keys())
          if missing:
              print(f"workspace is missing packages: {missing}", file=sys.stderr)
              sys.exit(1)
          if selected["rarpar"] != expected:
              print(
                  f"release tag {tag} expects rarpar {expected}, got {selected['rarpar']}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"release package versions: {selected}")
          PY
      # The one thing that has to hold before a tag becomes a release: the
      # packaged manifest must reach its sibling crates through the registry,
      # because a published crate carrying a path dependency cannot build for
      # anyone but us. Everything this compares comes from the workspace
      # manifest itself. An expected-version list written out here is a second
      # copy of numbers that already exist in Cargo.toml, and the first bump
      # that forgets it fails a release that was correct: this step spent
      # rarpar 0.4.0 pinned to unrar-rs 0.7.0 and par2-rs 0.8.0, versions two
      # minors behind what the workspace declared.
      - name: Validate packaged CLI registry dependencies
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#rarpar-v}"
          cargo package --locked --no-verify -p rarpar
          rm -rf "$RUNNER_TEMP/rarpar-release-source"
          mkdir -p "$RUNNER_TEMP/rarpar-release-source"
          tar -xzf "target/package/rarpar-${version}.crate" -C "$RUNNER_TEMP/rarpar-release-source"
          manifest="$RUNNER_TEMP/rarpar-release-source/rarpar-${version}/Cargo.toml"
          cargo metadata --locked --format-version 1 --no-deps \
            > "$RUNNER_TEMP/rarpar-release-source/workspace.json"
          cargo metadata --locked --format-version 1 \
            --manifest-path "$manifest" \
            > "$RUNNER_TEMP/rarpar-release-source/packaged.json"
          python3 - \
            "$RUNNER_TEMP/rarpar-release-source/workspace.json" \
            "$RUNNER_TEMP/rarpar-release-source/packaged.json" <<'PY'
          import json
          import sys

          workspace = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          packaged = json.load(open(sys.argv[2], "r", encoding="utf-8"))

          members = {package["name"]: package for package in workspace["packages"]}
          # Every normal dependency rarpar takes on another crate in this
          # workspace, with the requirement the workspace declares for it.
          declared = {
              dependency["name"]: dependency["req"]
              for dependency in members["rarpar"]["dependencies"]
              if dependency["name"] in members and dependency.get("kind") is None
          }
          if not declared:
              print("rarpar declares no in-workspace dependencies to check", file=sys.stderr)
              sys.exit(1)

          package = next(p for p in packaged["packages"] if p["name"] == "rarpar")
          dependencies = {
              dependency["name"]: dependency
              for dependency in package["dependencies"]
              if dependency.get("kind") is None
          }

          for name, requirement in sorted(declared.items()):
              dependency = dependencies.get(name)
              if dependency is None:
                  print(f"packaged rarpar dropped {name}", file=sys.stderr)
                  sys.exit(1)
              if dependency.get("source") is None or dependency.get("path"):
                  print(f"{name} is still a path dependency in the packaged manifest", file=sys.stderr)
                  sys.exit(1)
              if not dependency.get("req"):
                  print(f"{name} has no registry version requirement", file=sys.stderr)
                  sys.exit(1)
              if dependency["req"] != requirement:
                  print(
                      f"packaged rarpar requires {name} {dependency['req']}, "
                      f"but the workspace declares {requirement}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print(f"packaged dependency: {name} {dependency['req']}")
          PY
      - name: Hydrate the test corpus (release-tests)
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile release-tests
      - name: Run release preflight checks
        run: |
          cargo fmt --check --all
          cargo run --locked -p xtask -- docs --check
          cargo run --locked -p xtask -- docs --out target/dist/docs
          mandoc -Tlint target/dist/docs/share/man/man1/rarpar.1
          cargo clippy --locked -p rarpar --all-targets -- -D warnings
          cargo test --locked -p rarpar --no-fail-fast

  build:
    name: build-${{ matrix.platform }}
    needs: [release-trust, preflight]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    env:
      RARPAR_RELEASE_TARGET_DIR: ${{ github.workspace }}/target/rarpar-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64-gnu-direct
            runs_on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            features: runtime
            package_root: true
          - platform: linux-x86_64-musl-direct
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            features: runtime
            package_root: false
          - platform: linux-arm64-gnu-direct
            runs_on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            features: runtime
            package_root: true
          - platform: linux-arm64-musl-direct
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            features: runtime
            package_root: false
          - platform: darwin-arm64
            runs_on: macos-26
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            features: runtime
            package_root: false
          - platform: darwin-x86_64
            runs_on: macos-26-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            features: runtime
            package_root: false
          - platform: windows-x86_64
            runs_on: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            features: runtime
            package_root: false
          - platform: windows-arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            features: runtime
            package_root: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          packages=(mold)
          case "$TARGET" in
            x86_64-*) packages+=(nasm) ;;
          esac
          case "$TARGET" in
            *-musl) packages+=(musl-tools) ;;
          esac
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Install NASM (macOS)
        if: matrix.platform == 'darwin-x86_64'
        run: brew install nasm
      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Exclude build dir from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
          } catch {
            Write-Warning "Unable to configure Windows Defender exclusion: $($_.Exception.Message)"
          }
      - name: Configure build environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
              case "${{ matrix.target }}" in
                *-musl)
                  target_env="${{ matrix.target }}"
                  target_env="${target_env//-/_}"
                  printf 'CC_%s=%s\n' "$target_env" "musl-gcc" >> "$GITHUB_ENV"
                  ;;
                *)
                  echo "CC=cc" >> "$GITHUB_ENV"
                  echo "CXX=c++" >> "$GITHUB_ENV"
                  ;;
              esac
              ;;
            macOS)
              echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=." >> "$GITHUB_ENV"
              echo "CC=clang" >> "$GITHUB_ENV"
              echo "CXX=clang++" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Configure build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=. -Clinker=lld-link" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Stage rarpar release source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#rarpar-v}"
          cargo package --locked --no-verify -p rarpar
          rm -rf "$RUNNER_TEMP/rarpar-release-source"
          mkdir -p "$RUNNER_TEMP/rarpar-release-source"
          tar -xzf "target/package/rarpar-${version}.crate" -C "$RUNNER_TEMP/rarpar-release-source"
          source_dir="$RUNNER_TEMP/rarpar-release-source/rarpar-${version}"
          cargo metadata --locked --format-version 1 --no-deps \
            --manifest-path "$source_dir/Cargo.toml" \
            > "$RUNNER_TEMP/rarpar-release-source/metadata.json"
          python3 - "$RUNNER_TEMP/rarpar-release-source/metadata.json" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          package = next(
              package for package in metadata["packages"] if package["name"] == "rarpar"
          )
          dependencies = {dep["name"]: dep for dep in package["dependencies"]}
          for name in ("par2-rs", "unrar-rs"):
              dep = dependencies.get(name)
              if dep is None or dep.get("source") is None or dep.get("path") or not dep.get("req"):
                  print(f"{name} must be a registry dependency in packaged rarpar", file=sys.stderr)
                  sys.exit(1)
          PY
          echo "RARPAR_RELEASE_SOURCE=$source_dir" >> "$GITHUB_ENV"
      - name: Stage rarpar release source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG -replace '^rarpar-v', ''
          cargo package --locked --no-verify -p rarpar
          $root = Join-Path $env:RUNNER_TEMP "rarpar-release-source"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          tar -xzf "target/package/rarpar-$version.crate" -C $root
          $sourceDir = Join-Path $root "rarpar-$version"
          $manifest = Join-Path $sourceDir "Cargo.toml"
          $metadata = Join-Path $root "metadata.json"
          cargo metadata --locked --format-version 1 --no-deps --manifest-path $manifest `
            | Out-File -Encoding utf8 $metadata
          $check = @'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], "r", encoding="utf-8"))
          package = next(
              package for package in metadata["packages"] if package["name"] == "rarpar"
          )
          dependencies = {dep["name"]: dep for dep in package["dependencies"]}
          for name in ("par2-rs", "unrar-rs"):
              dep = dependencies.get(name)
              if dep is None or dep.get("source") is None or dep.get("path") or not dep.get("req"):
                  print(f"{name} must be a registry dependency in packaged rarpar", file=sys.stderr)
                  sys.exit(1)
          '@
          $check | python3 - $metadata
          if ($LASTEXITCODE -ne 0) {
            throw "packaged rarpar manifest dependency validation failed"
          }
          "RARPAR_RELEASE_SOURCE=$sourceDir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Audit release target features (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cargo run --locked -p xtask -- feature-audit
          --manifest "$RARPAR_RELEASE_SOURCE/Cargo.toml" --target ${{ matrix.target }}
          --features ${{ matrix.features }}
      - name: Audit release target features (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RARPAR_RELEASE_SOURCE "Cargo.toml"
          cargo run --locked -p xtask -- feature-audit `
            --manifest $manifest --target ${{ matrix.target }} `
            --features ${{ matrix.features }}
      - name: Build rarpar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          cargo build --locked --release --no-default-features \
            --manifest-path "$RARPAR_RELEASE_SOURCE/Cargo.toml" \
            --features "${{ matrix.features }}" \
            --target "${{ matrix.target }}" \
            --target-dir "$RARPAR_RELEASE_TARGET_DIR" 2>&1 \
            | tee "logs/rarpar-${{ matrix.platform }}-build.log"
      - name: Build rarpar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force logs | Out-Null
          $manifest = Join-Path $env:RARPAR_RELEASE_SOURCE "Cargo.toml"
          cargo build --locked --release --no-default-features `
            --manifest-path $manifest `
            --features ${{ matrix.features }} `
            --target ${{ matrix.target }} `
            --target-dir $env:RARPAR_RELEASE_TARGET_DIR 2>&1 `
            | Tee-Object -FilePath "logs\rarpar-${{ matrix.platform }}-build.log"
      - name: Generate manpage and completions
        shell: bash
        run: cargo run --locked -p xtask -- docs --out target/dist/docs
      - name: Hydrate the test corpus (cli)
        shell: bash
        run: cargo run --locked -p xtask -- test-corpus hydrate --profile cli
      - name: Smoke test release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="$RARPAR_RELEASE_TARGET_DIR/${{ matrix.target }}/release/rarpar"
          "$exe" --help > "logs/rarpar-${{ matrix.platform }}-help.log"
          "$exe" --version > "logs/rarpar-${{ matrix.platform }}-version.log"
          grep -Fxq "rarpar ${RELEASE_TAG#rarpar-v}" "logs/rarpar-${{ matrix.platform }}-version.log"
          "$exe" lb crates/unrar-rs/tests/fixtures/rar5/rar5_store.rar \
            > "logs/rarpar-${{ matrix.platform }}-lb.log"
          grep -Fxq small.txt "logs/rarpar-${{ matrix.platform }}-lb.log"
      - name: Smoke test release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RARPAR_RELEASE_TARGET_DIR "${{ matrix.target }}\release\rarpar.exe"
          & $exe --help | Tee-Object -FilePath "logs\rarpar-${{ matrix.platform }}-help.log"
          & $exe --version | Tee-Object -FilePath "logs\rarpar-${{ matrix.platform }}-version.log"
          $version = Get-Content "logs\rarpar-${{ matrix.platform }}-version.log" -Raw
          if ($version.Trim() -ne "rarpar $($env:RELEASE_TAG -replace '^rarpar-v', '')") {
            throw "rarpar --version output did not match release tag"
          }
          & $exe lb crates\unrar-rs\tests\fixtures\rar5\rar5_store.rar `
            | Tee-Object -FilePath "logs\rarpar-${{ matrix.platform }}-lb.log"
          if (-not (Select-String -Path "logs\rarpar-${{ matrix.platform }}-lb.log" -Pattern '^small\.txt$' -Quiet)) {
            throw "rarpar lb smoke test did not list small.txt"
          }
      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="rarpar-${RELEASE_TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          rm -rf package
          mkdir -p package dist
          cp "$RARPAR_RELEASE_TARGET_DIR/${{ matrix.target }}/release/rarpar" package/
          cp README.md package/
          cp tools/rarpar/LICENSE package/LICENSE
          cp LICENSE package/LICENSE.GPL-3.0-or-later
          cp crates/unrar-rs/LICENSE package/LICENSE.unrar-rs
          cp -R target/dist/docs/share package/share
          tar -czf "$archive" -C package .
          mv "$archive" dist/
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "rarpar-$env:RELEASE_TAG-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item (Join-Path $env:RARPAR_RELEASE_TARGET_DIR "${{ matrix.target }}\release\rarpar.exe") package\
          Copy-Item README.md package\
          Copy-Item tools\rarpar\LICENSE package\LICENSE
          Copy-Item LICENSE package\LICENSE.GPL-3.0-or-later
          Copy-Item crates\unrar-rs\LICENSE package\LICENSE.unrar-rs
          Copy-Item target\dist\docs\share package\share -Recurse
          Compress-Archive -Path package\* -DestinationPath $archive
          Move-Item $archive dist\
      - name: Stage package root inspection artifact (Linux GNU)
        if: matrix.package_root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package-root package-roots
          mkdir -p package-roots
          cargo run --locked -p xtask -- package-root \
            --binary "$RARPAR_RELEASE_TARGET_DIR/${{ matrix.target }}/release/rarpar" \
            --docs target/dist/docs \
            --out package-root \
            --target "${{ matrix.target }}"
          tar -czf "package-roots/package-root-${RELEASE_TAG}-${{ matrix.platform }}.tar.gz" \
            -C package-root .
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rarpar-release-${{ matrix.platform }}
          path: |
            dist/*
            logs/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload package root inspection artifact
        if: matrix.package_root
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rarpar-package-root-${{ matrix.platform }}
          path: package-roots/*
          if-no-files-found: error
          retention-days: 14

  collect:
    name: collect-and-sign-archives
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download separate platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rarpar-release-*
          path: dist
          merge-multiple: false
      - name: Collect exact archive set and checksums
        run: python3 .github/release-signing/release_assets.py collect --source dist --directory release-assets --tag "$RELEASE_TAG"
      - name: Export SLSA subjects
        id: subjects
        run: |
          set -euo pipefail
          echo "base64_subjects=$(base64 < release-assets/SHA256SUMS | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify checksum manifest
        working-directory: release-assets
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --new-bundle-format=true \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS
      - name: Preserve signed binary assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-binary-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  archive-provenance:
    name: archive-slsa-provenance
    needs: [collect]
    permissions:
      actions: read
      # Required by the reusable workflow's declared upload job, even disabled.
      contents: write
      id-token: write
    # The generator requires a full version tag to verify its own builder binary.
    # The independent verifier below pins this exact builder identity as well.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.collect.outputs.base64_subjects }}
      provenance-name: rarpar-provenance.intoto.jsonl
      upload-assets: false

  deploy:
    name: verify-and-finalize-binary-release
    needs: [collect, archive-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download signed binary assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-binary-assets
          path: release-assets
      - name: Download signed archive provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rarpar-provenance.intoto.jsonl
          path: release-assets
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install SLSA verifier
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify all archives, signatures and provenance
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 .github/release-signing/release_assets.py verify
          --directory release-assets --tag "$RELEASE_TAG"
          --repository "$REPOSITORY" --commit "$SOURCE_COMMIT"
      - name: Verify draft downloads and finalize release
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 .github/release-signing/release_assets.py finalize
          --directory release-assets --tag "$RELEASE_TAG"
          --repository "$REPOSITORY" --commit "$SOURCE_COMMIT"
      - name: Update Homebrew tap
        if: steps.finalize.outputs.published == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAP_SIGNING_KEY: ${{ secrets.TAP_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_PUSH_TOKEN not set; skipping tap update."
            exit 0
          fi
          if [ -z "${TAP_SIGNING_KEY:-}" ]; then
            echo "::notice::TAP_SIGNING_KEY not set; skipping the optional Homebrew update."
            exit 0
          fi
          signing_key="$(mktemp)"
          trap 'rm -f "$signing_key"' EXIT
          chmod 600 "$signing_key"
          printf '%s\n' "$TAP_SIGNING_KEY" > "$signing_key"

          VERSION="${RELEASE_TAG#rarpar-v}"
          LINUX_X86_GNU_DIRECT_SHA=$(shasum -a 256 "release-assets/rarpar-${RELEASE_TAG}-linux-x86_64-gnu-direct.tar.gz" | cut -d ' ' -f1)
          LINUX_X86_MUSL_DIRECT_SHA=$(shasum -a 256 "release-assets/rarpar-${RELEASE_TAG}-linux-x86_64-musl-direct.tar.gz" | cut -d ' ' -f1)
          LINUX_ARM_GNU_DIRECT_SHA=$(shasum -a 256 "release-assets/rarpar-${RELEASE_TAG}-linux-arm64-gnu-direct.tar.gz" | cut -d ' ' -f1)
          LINUX_ARM_MUSL_DIRECT_SHA=$(shasum -a 256 "release-assets/rarpar-${RELEASE_TAG}-linux-arm64-musl-direct.tar.gz" | cut -d ' ' -f1)
          DARWIN_ARM_SHA=$(shasum -a 256 "release-assets/rarpar-${RELEASE_TAG}-darwin-arm64.tar.gz" | cut -d ' ' -f1)
          DARWIN_X86_SHA=$(shasum -a 256 "release-assets/rarpar-${RELEASE_TAG}-darwin-x86_64.tar.gz" | cut -d ' ' -f1)
          REPO="${{ github.repository }}"

          mkdir -p tap/Formula
          cat > tap/Formula/rarpar.rb << FORMULA
          require "open3"

          module RarparReleaseSelection
            MIN_GLIBC_VERSION = [2, 35].freeze

            def self.glibc_supported?
              version = glibc_version
              return false unless version

              (version <=> MIN_GLIBC_VERSION) >= 0
            end

            def self.glibc_version
              output = capture_getconf || capture_ldd
              match = output.to_s.match(/(?:glibc|GNU libc|GLIBC)[^0-9]*(\d+)\.(\d+)/i)
              return unless match

              [match[1].to_i, match[2].to_i]
            end

            def self.capture_getconf
              output, status = Open3.capture2("getconf", "GNU_LIBC_VERSION")
              status.success? ? output.strip : nil
            rescue
              nil
            end

            def self.capture_ldd
              output, status = Open3.capture2e("ldd", "--version")
              status.success? ? output.lines.first.to_s.strip : nil
            rescue
              nil
            end
          end

          class Rarpar < Formula
            desc "Smart RAR/PAR2 repair and extraction CLI"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license all_of: ["GPL-3.0-or-later", :cannot_represent]

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/rarpar-v${VERSION}/rarpar-rarpar-v${VERSION}-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/rarpar-v${VERSION}/rarpar-rarpar-v${VERSION}-darwin-x86_64.tar.gz"
                sha256 "${DARWIN_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                if RarparReleaseSelection.glibc_supported?
                  url "https://github.com/${REPO}/releases/download/rarpar-v${VERSION}/rarpar-rarpar-v${VERSION}-linux-arm64-gnu-direct.tar.gz"
                  sha256 "${LINUX_ARM_GNU_DIRECT_SHA}"
                else
                  url "https://github.com/${REPO}/releases/download/rarpar-v${VERSION}/rarpar-rarpar-v${VERSION}-linux-arm64-musl-direct.tar.gz"
                  sha256 "${LINUX_ARM_MUSL_DIRECT_SHA}"
                end
              end

              on_intel do
                if RarparReleaseSelection.glibc_supported?
                  url "https://github.com/${REPO}/releases/download/rarpar-v${VERSION}/rarpar-rarpar-v${VERSION}-linux-x86_64-gnu-direct.tar.gz"
                  sha256 "${LINUX_X86_GNU_DIRECT_SHA}"
                else
                  url "https://github.com/${REPO}/releases/download/rarpar-v${VERSION}/rarpar-rarpar-v${VERSION}-linux-x86_64-musl-direct.tar.gz"
                  sha256 "${LINUX_X86_MUSL_DIRECT_SHA}"
                end
              end
            end

            def install
              bin.install "rarpar"
              man1.install "share/man/man1/rarpar.1" if File.exist?("share/man/man1/rarpar.1")
              bash_completion.install "share/bash-completion/completions/rarpar" if File.exist?("share/bash-completion/completions/rarpar")
              if File.exist?("share/zsh/site-functions/_rarpar")
                zsh_completion.install "share/zsh/site-functions/_rarpar"
              end
              if File.exist?("share/fish/vendor_completions.d/rarpar.fish")
                fish_completion.install "share/fish/vendor_completions.d/rarpar.fish"
              end
              pkgshare.install "README.md" if File.exist?("README.md")
              pkgshare.install "LICENSE" if File.exist?("LICENSE")
              if File.exist?("LICENSE.GPL-3.0-or-later")
                pkgshare.install "LICENSE.GPL-3.0-or-later"
              end
              pkgshare.install "LICENSE.unrar-rs" if File.exist?("LICENSE.unrar-rs")
            end

            test do
              assert_match "rarpar", shell_output("#{bin}/rarpar --help")
              assert_match "rarpar #{version}", shell_output("#{bin}/rarpar --version")
              assert_path_exists man1/"rarpar.1"
            end
          end
          FORMULA

          sed -i 's/^          //' tap/Formula/rarpar.rb
          ruby -c tap/Formula/rarpar.rb

          git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-rarpar.git" tap-repo
          mkdir -p tap-repo/Formula
          cp tap/Formula/rarpar.rb tap-repo/Formula/rarpar.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rarpar.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
          else
            git -c gpg.format=ssh -c user.signingkey="$signing_key" commit -S -m "rarpar ${VERSION}"
            git -c gpg.format=ssh \
              -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-signing/allowed_signers" \
              verify-commit HEAD
            git push origin HEAD:main
          fi
