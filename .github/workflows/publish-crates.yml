name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preflight only. Computes the publish plan and verifies every crate it would publish, without publishing to crates.io.
        required: true
        default: true
        type: boolean

concurrency:
  group: rarpar-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-v1-rarpar-publish-preflight-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v1-rarpar-publish-preflight-
            gha-sccache-v1-rarpar-publish-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      # The plan is every publishable workspace crate whose manifest version
      # is not on crates.io yet, in dependency order: a crate is published only
      # after every workspace crate it depends on. Nothing is typed in by hand;
      # the manifests are the single source of truth, and a crate whose version
      # already exists in the registry is left alone. A manifest version below
      # the registry's newest release is a mistake and fails the run.
      - name: Compute the publish plan
        id: plan
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--format-version", "1", "--no-deps",
          ]))
          members = {p["id"]: p for p in metadata["packages"]}
          publishable = {
              p["name"]: p for p in members.values() if p.get("publish") != []
          }
          for name in ("rarpar", "xtask"):
              if name in publishable:
                  print(f"{name} must have publish = false", file=sys.stderr)
                  sys.exit(1)

          # Dependency order among the publishable crates (path dependencies).
          deps = {
              name: sorted(
                  d["name"] for d in p["dependencies"]
                  if d["name"] in publishable and d.get("path")
                  and d.get("kind") in (None, "normal", "build")
              )
              for name, p in publishable.items()
          }
          # Among crates whose dependencies are all placed, keep the
          # workspace member order from the root manifest.
          member_order = [members[i]["name"] for i in metadata["workspace_members"]]
          order = []
          while len(order) < len(publishable):
              ready = sorted(
                  (n for n in publishable if n not in order
                   and all(d in order for d in deps[n])),
                  key=member_order.index,
              )
              if not ready:
                  print(f"dependency cycle among {sorted(set(publishable) - set(order))}", file=sys.stderr)
                  sys.exit(1)
              order.extend(ready)

          def index_path(name):
              if len(name) == 1:
                  return f"1/{name}"
              if len(name) == 2:
                  return f"2/{name}"
              if len(name) == 3:
                  return f"3/{name[0]}/{name}"
              return f"{name[:2]}/{name[2:4]}/{name}"

          def published_versions(name):
              url = f"https://index.crates.io/{index_path(name)}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = response.read().decode()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return []
                  raise
              return [json.loads(line)["vers"] for line in body.splitlines() if line.strip()]

          def key(version):
              return tuple(int(part) for part in version.split("-")[0].split("."))

          plan = []
          rows = []
          failed = False
          for name in order:
              version = publishable[name]["version"]
              published = published_versions(name)
              newest = max(published, key=key) if published else None
              if version in published:
                  action = "already published"
              elif newest is not None and key(version) < key(newest):
                  action = f"ERROR: manifest {version} is below the newest published {newest}"
                  failed = True
              else:
                  action = "publish" + ("" if published else " (first release)")
                  plan.append(name)
              rows.append((name, version, newest or "none", action))

          summary = ["| crate | manifest | newest on crates.io | action |", "|---|---|---|---|"]
          summary += [f"| {n} | {v} | {c} | {a} |" for n, v, c, a in rows]
          summary.append("")
          summary.append("Publish order: " + (" -> ".join(plan) if plan else "nothing to publish"))
          text = "\n".join(summary)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("## Publish plan\n\n" + text + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("plan=" + " ".join(plan) + "\n")
          if failed:
              sys.exit(1)
          PY
      # The workspace suite and clippy already ran on this exact commit in `ci`
      # (it triggers on pushes to main and on every pull request). Re-running
      # them here cost ~30 minutes per publish and could only ever reproduce a
      # result we already have, so verify the recorded conclusions instead.
      # `unrar-tests`, `par2-tests` and `par3-tests` are the lanes that run those
      # crates' complete suites (`fixture-tests` covers the rest of the workspace), so
      # a library publish is gated on its own crate's tests, not just the CLI's.
      # This is a gate, not a formality: a commit whose `ci` lanes did not pass
      # cannot be published. Named lanes rather than the run's overall
      # conclusion, because lanes outside the publishable code — ClusterFuzzLite
      # on its own nightly, for one — must not be able to block a release.
      - name: Verify this commit already passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required="fmt clippy clippy-aarch64 unit-tests fixture-tests unrar-tests par2-tests par3-tests"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.name)\t\(.conclusion)"' > "$RUNNER_TEMP/checks.tsv"
          echo "recorded check runs for ${COMMIT_SHA}:"
          cat "$RUNNER_TEMP/checks.tsv"
          missing=""
          for lane in $required; do
            conclusion="$(awk -F'\t' -v l="$lane" '$1 == l {print $2; exit}' "$RUNNER_TEMP/checks.tsv")"
            if [ -z "$conclusion" ]; then
              missing="${missing} ${lane}(absent)"
            elif [ "$conclusion" != "success" ] && [ "$conclusion" != "skipped" ]; then
              missing="${missing} ${lane}(${conclusion})"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::refusing to publish ${COMMIT_SHA}: required CI lanes not green:${missing}"
            exit 1
          fi
          echo "all required lanes green for ${COMMIT_SHA}"
      # Kept: cheap, and specific to packaging rather than to the code.
      - name: Run publish preflight checks
        run: |
          cargo fmt --check --all
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-semver-checks@0.50.0
      # A version number is a compatibility promise, and until this step nothing
      # in the workflow checked that the promise held. `Check workspace version`
      # proves the manifests agree with each other and with the input; it cannot
      # see that the code underneath them stopped being compatible. Under
      # Cargo's pre-1.0 rules `0.4.1 -> 0.4.2` is a *compatible* bump, so a
      # break reaches everyone requiring "0.4" on their next `cargo update`,
      # with no version signal that anything moved — and registry versions are
      # immutable, so the only remedy after the fact is a yank plus the bump
      # that should have happened. This compares each crate against its own
      # published baseline and exits 100 when the version bump is too small for
      # the change it carries.
      #
      # A floor, not a proof. On the par2-rs 0.4.2 that prompted this gate it
      # caught the added `Par2RepairerOptions` field but missed `scan_packets`
      # changing its return type: 195 pass, 1 fail, one real break unreported.
      # Read a green result as "no known lint fired", and still diff the public
      # surface by hand for a release that touches library API.
      - name: Check semver against the published baselines
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail
          if [ -z "$PLAN" ]; then
            echo "nothing to publish; skipping semver-checks"
            exit 0
          fi
          for package in $PLAN; do
            # A crate with no release on crates.io has no baseline to compare
            # against, and cargo-semver-checks fails rather than passing
            # vacuously. Nothing can have broken for a first publish.
            tmp="$(mktemp -d)"
            if ! ( cd "$tmp" && cargo info "$package" >/dev/null 2>&1 ); then
              rm -rf "$tmp"
              echo "${package} has no published baseline yet; skipping semver-checks"
              continue
            fi
            rm -rf "$tmp"
            echo "::group::cargo-semver-checks ${package}"
            cargo semver-checks --package "$package"
            echo "::endgroup::"
          done
      # One `cargo package` over the whole plan: Cargo packages interdependent
      # workspace crates together and verifies each against the sibling
      # `.crate` files it just built, so a downstream crate is checked against
      # the exact upstream it will be published with, before either exists in
      # the registry.
      - name: Verify package contents
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          set -euo pipefail
          if [ -z "$PLAN" ]; then
            echo "nothing to publish; skipping package verification"
            exit 0
          fi
          mkdir -p .ci/package-lists
          package_args=()
          for crate in $PLAN; do
            package_args+=(-p "$crate")
          done
          cargo package --locked "${package_args[@]}"
          for crate in $PLAN; do
            cargo package --locked --list -p "$crate" > ".ci/package-lists/${crate}.txt"
            if grep -n 'tests/fixtures' ".ci/package-lists/${crate}.txt"; then
              echo "::error::${crate} package includes fixture files"
              exit 1
            fi
            if [ "$crate" = par3-rs ] && grep -n '^benchmarks/' ".ci/package-lists/${crate}.txt"; then
              echo "::error::par3-rs package includes benchmark evidence"
              exit 1
            fi
            if [ "$crate" = unrar-rs ]; then
              grep -Fxq LICENSE ".ci/package-lists/${crate}.txt"
            fi
          done
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: always() && steps.sccache-restore.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}

  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [preflight]
    if: ${{ inputs.dry_run == false && needs.preflight.outputs.plan != '' }}
    environment: crates-io
    permissions:
      contents: read
      # crates.io Trusted Publishing: the job's OIDC identity (this repository,
      # this workflow file, the crates-io environment) is exchanged for a
      # short-lived publish token; no long-lived registry token is stored.
      id-token: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. -C link-arg=-fuse-ld=mold
      CC: sccache cc
      CXX: sccache c++
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold nasm
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-v1-rarpar-publish-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v1-rarpar-publish-
            gha-sccache-v1-rarpar-
      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true
      # Every publishable crate lists this repository, this workflow and the
      # crates-io environment as a Trusted Publisher on crates.io; the action
      # mints a token scoped to those crates for the duration of the job. A
      # crate's first release has to be published by hand, because crates.io
      # only offers Trusted Publishing on a crate that already exists; add the
      # Trusted Publisher right after, before the next run reaches it.
      - name: Authenticate to crates.io through Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          PLAN: ${{ needs.preflight.outputs.plan }}
        run: |
          set -euo pipefail
          mkdir -p .ci/package-lists

          verify_package_contents() {
            crate="$1"
            cargo package --locked -p "$crate"
            cargo package --locked --list -p "$crate" > ".ci/package-lists/${crate}.txt"
            if grep -n 'tests/fixtures' ".ci/package-lists/${crate}.txt"; then
              echo "::error::${crate} package includes fixture files"
              exit 1
            fi
            if [ "$crate" = par3-rs ] && grep -n '^benchmarks/' ".ci/package-lists/${crate}.txt"; then
              echo "::error::par3-rs package includes benchmark evidence"
              exit 1
            fi
            if [ "$crate" = unrar-rs ]; then
              grep -Fxq LICENSE ".ci/package-lists/${crate}.txt"
            fi
          }

          publish_with_retry() {
            crate="$1"
            for attempt in 1 2 3 4 5 6; do
              echo "Publishing ${crate} (attempt ${attempt})"
              if cargo publish --locked -p "$crate"; then
                return 0
              fi
              if [ "$attempt" -eq 6 ]; then
                return 1
              fi
              sleep 60
            done
          }

          wait_for_crate_version() {
            crate="$1"
            version="$2"
            local tmp
            for attempt in $(seq 1 20); do
              tmp="$(mktemp -d)"
              echo "Waiting for ${crate} ${version} in crates.io index (attempt ${attempt})"
              if (
                cd "$tmp"
                cargo info "${crate}@${version}" >/dev/null 2>&1
              ); then
                rm -rf "$tmp"
                return 0
              fi
              rm -rf "$tmp"
              sleep 30
            done
            echo "timed out waiting for ${crate} ${version} in crates.io index" >&2
            return 1
          }

          crate_version() {
            cargo metadata --locked --format-version 1 --no-deps \
              | python3 -c 'import json,sys; crate=sys.argv[1]; packages=json.load(sys.stdin)["packages"]; print(next(package["version"] for package in packages if package["name"] == crate))' "$1"
          }

          echo "publish order: $PLAN"
          for crate in $PLAN; do
            verify_package_contents "$crate"
            publish_with_retry "$crate"
            wait_for_crate_version "$crate" "$(crate_version "$crate")"
          done
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Save sccache directory
        if: always() && steps.sccache-restore.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.sccache-restore.outputs.cache-primary-key }}
