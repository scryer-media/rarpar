name: ClusterFuzzLite batch fuzzing

# Deep fuzzing: the long-running counterpart to the five-minute code-change lane
# on pull requests.
#
# Nightly rather than weekly. These are container formats whose interesting
# states are several correct headers deep, so a run's value is superlinear in
# its budget for a long time before it plateaus — and a corpus that grows every
# night makes every later run start further in. Weekly also meant a build
# breakage sat undetected for six days at a time, which is how the last one was
# found.
#
# Two sanitizers, because they answer different questions: ASan finds the
# memory error, UBSan finds the arithmetic that would have caused one on a
# different target — integer overflow in a length computation, a bad shift, an
# unaligned reference. Rust catches many of these in debug, but these crates
# run release with overflow checks off, which is exactly where UBSan earns its
# place.

on:
  schedule:
    # 02:41 every day. Offset from the hour: the runner pool is measurably
    # busier on the hour, and nothing here needs a round number.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: 'Total fuzzing budget per sanitizer, in seconds'
        required: false
        default: '3600'
        type: string

permissions:
  contents: read

jobs:
  batch-fuzzing:
    name: batch (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      # One sanitizer finding must not cancel the other's run: they cover
      # different faults and a UBSan report is not made redundant by an ASan
      # crash.
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    permissions:
      contents: read
      # `output-sarif` publishes findings to the Security tab rather than
      # leaving them in a run log nobody reads. Only this job produces them,
      # and this workflow only ever runs on this repository (schedule and
      # manual dispatch), so the write is never handed to a fork's token.
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.sanitizer }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ inputs.fuzz-seconds || 3600 }}
          mode: batch
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true

  # What the corpus is actually reaching. Without this the fuzzing budget is
  # spent on faith: a target whose coverage has been flat for a month is either
  # done or stuck behind a check it cannot satisfy, and those need opposite
  # responses.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Reads the corpus the batch jobs just extended, so it runs after them.
    needs: [batch-fuzzing]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage

      - name: Report coverage
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage

  # A corpus grows monotonically otherwise, and most of what it accumulates is
  # inputs that reach nothing the corpus did not already reach. Pruning keeps
  # the set minimal, which is what makes tomorrow's run spend its budget on new
  # ground instead of re-executing thousands of redundant inputs.
  prune:
    name: prune corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [coverage]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust

      - name: Prune
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
