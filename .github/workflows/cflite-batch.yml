name: ClusterFuzzLite batch fuzzing

# Deep fuzzing: the long-running counterpart to the five-minute code-change lane
# on pull requests.
#
# Nightly rather than weekly. These are container formats whose interesting
# states are several correct headers deep, so a run's value is superlinear in
# its budget for a long time before it plateaus — and a corpus that grows every
# night makes every later run start further in. Weekly also meant a build
# breakage sat undetected for six days at a time, which is how the last one was
# found.
#
# One sanitizer, deliberately. Both fuzzed crates are pure Rust — no build.rs,
# no C, no assembly, RustCrypto and blake2s_simd all the way down — and Rust
# has no -Zsanitizer=undefined, so a UBSan lane would instrument nothing while
# looking like coverage (its first run proved it: cargo-fuzz builds ASan
# regardless of the job's sanitizer, and the bad-build check rejected every
# target as "compiled with ASan"). The arithmetic class UBSan would have
# covered is caught the Rust way instead: the fuzzers build with debug
# assertions and overflow checks enabled in the optimized build
# (`cargo fuzz build -O -a`), so an overflowing length computation panics
# rather than wrapping.

on:
  schedule:
    # 02:41 every day. Offset from the hour: the runner pool is measurably
    # busier on the hour, and nothing here needs a round number.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: 'Total fuzzing budget, in seconds'
        required: false
        default: '7200'
        type: string

permissions:
  contents: read

jobs:
  batch-fuzzing:
    name: batch (address)
    runs-on: ubuntu-24.04
    # The two-hour budget is fuzzing time only: the sanitizer build of five
    # targets comes first, and a job killed at its timeout discards the corpus
    # it just grew. An hour of headroom is cheap insurance for that.
    timeout-minutes: 180
    permissions:
      contents: read
      # For the SARIF upload at the end of the job. Only this job needs it,
      # and this workflow only ever runs on this repository (schedule and
      # manual dispatch), so the write is never handed to a fork's token.
      security-events: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ inputs.fuzz-seconds || 7200 }}
          mode: batch
          sanitizer: address
        # Deliberately not `output-sarif: true`. This job carried that flag
        # for nineteen failing nights (2026-08-16 → 09-04) and nothing ever
        # reached the Security tab, for two reasons. run_fuzzers is a bare
        # Docker action: the flag makes it *write* cifuzz-sarif/results.sarif
        # and nothing here uploaded it. Worse, the file it writes is not a
        # report of the run — batch mode fuzzes every target without stopping
        # at the first bug, then serialises only the target it walked last
        # (run_fuzzers.py, "TODO: Handle multiple crashes"), so a rar_extract
        # finding followed by a clean par2 target uploads an empty SARIF, and
        # its rule table has no entry for timeouts or Rust panics. The
        # reproducers CIFuzz saves under out/artifacts are complete and
        # accurate, so the SARIF is rendered from those instead, below.
        #
        # Timeouts are findings here, and without this they are discarded.
        #
        # The 2026-08-17 run watched rar_extract spend 34 s on a single unit
        # against a 25 s limit, logged "Detected bug", and then two seconds
        # later logged "finished running without reportable crashes" and went
        # green. Nothing was uploaded, the SARIF came out empty, and the
        # reproducer — written to a container /tmp, not to out/artifacts — was
        # destroyed with the container. The corpus could not answer the
        # question afterwards: replaying all 3873 retained inputs takes 223 ms
        # total, slowest unit 19 ms, because libFuzzer only promotes an input
        # that adds coverage and a unit that merely runs long adds none.
        #
        # The cause is a classifier in CIFuzz that keys off the artifact's
        # filename: a testcase named `timeout-*` is reportable only if
        # REPORT_TIMEOUTS says so, and it defaults to False
        # (infra/cifuzz/config_utils.py: `environment.get_bool('REPORT_TIMEOUTS',
        # False)`). It short-circuits there, which is why the log shows no
        # reproducibility check at all. There is no action input for it, so it
        # goes through the environment; `get_bool` accepts only 'true'/'false',
        # and anything else raises rather than silently reading as false.
        #
        # REPORT_OOMS already defaults to True, so out-of-memory findings were
        # never subject to this and need no flag.
        #
        # Deliberately not set on the pull request lane: until a timeout is
        # captured we cannot tell a pathological input from a stalled shared
        # runner, and that ambiguity belongs in a nightly report rather than in
        # a gate that blocks someone's merge.
        env:
          REPORT_TIMEOUTS: 'true'

      # One SARIF result per saved reproducer, across every target, from the
      # out/artifacts/<target>/<sanitizer>/ tree that run_fuzzers leaves
      # behind (the same files the crashes-<target> artifacts hold). Both
      # steps run `if: always()`: run_fuzzers exits non-zero precisely when it
      # has something to report, and a clean night must still upload an empty
      # run so code scanning can mark earlier alerts fixed. Stdlib Python
      # only; nothing is installed on this runner after the container exits.
      - name: Render findings as SARIF
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -B .github/scripts/cflite_sarif.py \
            --artifacts out/artifacts \
            --output cflite-findings.sarif \
            --source-prefix /src/rarpar/ \
            --run-url "$RUN_URL" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      # Pinned to the same commit CodeQL and Scorecard use in codeql.yml, so
      # there is one codeql-action version to bump. The category keeps these
      # results in their own code-scanning stream, separate from CodeQL's.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: cflite-findings.sarif
          category: clusterfuzzlite-batch-address

  # What the corpus is actually reaching. Without this the fuzzing budget is
  # spent on faith: a target whose coverage has been flat for a month is either
  # done or stuck behind a check it cannot satisfy, and those need opposite
  # responses.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Reads the corpus the batch jobs just extended, so it runs after them.
    needs: [batch-fuzzing]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage

      - name: Report coverage
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage

  # Measured on the 2026-08-17 run, since "the corpus is being reused" is the
  # kind of claim that is easy to assume and easy to get wrong: every target
  # downloads its corpus before fuzzing and uploads it after, and libFuzzer
  # reads all of it — rar_extract logged `1550 files found`, `seed corpus:
  # files: 1550`, then `INITED ... corp: 1503`, the 47 dropped being inputs
  # that contribute no feature the rest already cover. (`Loaded 1024/1566` in
  # the same log is a progress line printed every 1024 files, not a cap.)
  # Across the run the corpus went 6.5 MB out of batch to 3.8 MB out of prune,
  # which is this job doing its job.
  #
  # A corpus grows monotonically otherwise, and most of what it accumulates is
  # inputs that reach nothing the corpus did not already reach. Pruning keeps
  # the set minimal, which is what makes tomorrow's run spend its budget on new
  # ground instead of re-executing thousands of redundant inputs.
  prune:
    name: prune corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [coverage]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust

      - name: Prune
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
