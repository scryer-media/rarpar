<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">unrar-rs relative speed benchmark</title>
  <desc id="desc">Fourteen benchmark workloads grouped by machine. Bars to the right of one times parity show unrar-rs faster; bars to the left show unrar 7.20 faster.</desc>
  <style>
    .bg { fill: #ffffff; }
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; }
    .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; }
    .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; }
    .tick { font-size: 11px; fill: #667085; }
    .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; }
    .parity { stroke: #172033; stroke-width: 1.5; }
    .rule { stroke: #e7eaf0; stroke-width: 1; }
    .faster { fill: #2563eb; }
    .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      text { fill: #e6edf3; }
      .subtitle, .column, .timing, .tick { fill: #9ca7b5; }
      .grid { stroke: #30363d; }
      .parity { stroke: #e6edf3; }
      .rule { stroke: #21262d; }
      .faster { fill: #58a6ff; }
      .slower { fill: #f2a65a; }
    }
  </style>

  <rect class="bg" width="1200" height="790"/>

  <text class="title" x="48" y="48">unrar-rs relative speed vs. unrar 7.20</text>
  <text class="subtitle" x="48" y="75">Lower elapsed time is better. Ratio = unrar 7.20 time ÷ unrar-rs time.</text>

  <g aria-label="Legend">
    <rect class="faster" x="898" y="39" width="14" height="14" rx="2"/>
    <text class="subtitle" x="920" y="51">unrar-rs faster</text>
    <rect class="slower" x="1051" y="39" width="14" height="14" rx="2"/>
    <text class="subtitle" x="1073" y="51">unrar faster</text>
  </g>

  <text class="column" x="48" y="112">Workload · elapsed time (unrar → unrar-rs)</text>
  <text class="column" x="620" y="112">Relative speed</text>

  <g aria-label="Relative speed axis">
    <line class="grid" x1="620" y1="121" x2="620" y2="746"/>
    <line class="parity" x1="752.5" y1="121" x2="752.5" y2="746"/>
    <line class="grid" x1="885" y1="121" x2="885" y2="746"/>
    <line class="grid" x1="1017.5" y1="121" x2="1017.5" y2="746"/>
    <line class="grid" x1="1150" y1="121" x2="1150" y2="746"/>
    <text class="tick" x="620" y="762" text-anchor="middle">0.5×</text>
    <text class="tick" x="752.5" y="762" text-anchor="middle">1× parity</text>
    <text class="tick" x="885" y="762" text-anchor="middle">2×</text>
    <text class="tick" x="1017.5" y="762" text-anchor="middle">4×</text>
    <text class="tick" x="1150" y="762" text-anchor="middle">8×</text>
  </g>

  <g aria-label="M5 Max benchmarks">
    <text class="machine" x="48" y="140">M5 Max</text>

    <text class="workload" x="48" y="164">RAR7 video · 4.9 GB · 4.6 GB dictionary · -m3</text>
    <text class="timing" x="48" y="180">8.6 s → 5.8 s</text>
    <rect class="faster" x="752.5" y="156" width="77.5" height="14" rx="2"/>
    <text class="ratio" x="838" y="168">1.5×</text>

    <text class="workload" x="48" y="200">RAR5 encrypted · AES-256</text>
    <text class="timing" x="48" y="216">0.41 s → 0.25 s</text>
    <rect class="faster" x="752.5" y="192" width="89.8" height="14" rx="2"/>
    <text class="ratio" x="850" y="204">1.6×</text>

    <text class="workload" x="48" y="236">RAR5 solid video · 225 MB</text>
    <text class="timing" x="48" y="252">0.27 s → 0.22 s</text>
    <rect class="faster" x="752.5" y="228" width="34.9" height="14" rx="2"/>
    <text class="ratio" x="795" y="240">1.2×</text>

    <text class="workload" x="48" y="272">Store-mode verify · BLAKE2sp · 4.9 GB</text>
    <text class="timing" x="48" y="288">1.27 s → 0.76 s</text>
    <rect class="faster" x="752.5" y="264" width="101.5" height="14" rx="2"/>
    <text class="ratio" x="862" y="276">1.7×</text>

    <text class="workload" x="48" y="308">RAR4 solid video · CPU seconds</text>
    <text class="timing" x="48" y="324">1.21 s → 0.19 s</text>
    <rect class="faster" x="752.5" y="300" width="342.5" height="14" rx="2"/>
    <text class="ratio" x="1103" y="312">6×</text>

    <text class="workload" x="48" y="344">RAR4 PPMd solid text · 200 MB</text>
    <text class="timing" x="48" y="360">44.2 s → 50.9 s</text>
    <rect class="slower" x="725.8" y="336" width="26.7" height="14" rx="2"/>
    <text class="ratio" x="717.8" y="348" text-anchor="end">0.87×</text>
  </g>

  <line class="rule" x1="48" y1="375" x2="1150" y2="375"/>

  <g aria-label="Intel Core Ultra 9 285H benchmarks">
    <text class="machine" x="48" y="401">285H</text>

    <text class="workload" x="48" y="425">RAR7 video · 4.9 GB · -m3</text>
    <text class="timing" x="48" y="441">17.7 s → 13.5 s</text>
    <rect class="faster" x="752.5" y="417" width="50.2" height="14" rx="2"/>
    <text class="ratio" x="810.7" y="429">1.3×</text>

    <text class="workload" x="48" y="461">RAR5 encrypted · AES-256</text>
    <text class="timing" x="48" y="477">0.83 s → 0.52 s</text>
    <rect class="faster" x="752.5" y="453" width="89.8" height="14" rx="2"/>
    <text class="ratio" x="850.3" y="465">1.6×</text>

    <text class="workload" x="48" y="497">RAR5 solid video · 216 MB</text>
    <text class="timing" x="48" y="513">0.78 s → 0.54 s</text>
    <rect class="faster" x="752.5" y="489" width="64.3" height="14" rx="2"/>
    <text class="ratio" x="824.8" y="501">1.4×</text>

    <text class="workload" x="48" y="533">RAR5 solid text · 157 MB</text>
    <text class="timing" x="48" y="549">1.52 s → 2.98 s</text>
    <rect class="slower" x="620" y="525" width="132.5" height="14" rx="2"/>
    <text class="ratio" x="612" y="537" text-anchor="end">0.5×</text>

    <text class="workload" x="48" y="569">RAR4 PPMd solid text · 156 MB</text>
    <text class="timing" x="48" y="585">28.7 s → 47.5 s</text>
    <rect class="slower" x="654.9" y="561" width="97.6" height="14" rx="2"/>
    <text class="ratio" x="646.9" y="573" text-anchor="end">0.6×</text>
  </g>

  <line class="rule" x1="48" y1="600" x2="1150" y2="600"/>

  <g aria-label="Ryzen 5 3600 benchmarks">
    <text class="machine" x="48" y="626">Ryzen 5 3600</text>

    <text class="workload" x="48" y="650">RAR7 video · 4.94 GB · -m3</text>
    <text class="timing" x="48" y="666">13.5 s → 13.6 s</text>
    <rect class="slower" x="750.6" y="642" width="1.9" height="14" rx="1"/>
    <text class="ratio" x="760.5" y="654">parity</text>

    <text class="workload" x="48" y="686">Store-mode verify · BLAKE2sp · 4.94 GB</text>
    <text class="timing" x="48" y="702">3.48 s → 1.80 s</text>
    <rect class="faster" x="752.5" y="678" width="122.7" height="14" rx="2"/>
    <text class="ratio" x="883.2" y="690">1.9×</text>

    <text class="workload" x="48" y="722">Store-mode extract to disk · 4.94 GB</text>
    <text class="timing" x="48" y="738">3.28 s → 5.0 s</text>
    <rect class="slower" x="699.5" y="714" width="53" height="14" rx="2"/>
    <text class="ratio" x="691.5" y="726" text-anchor="end">0.66×</text>
  </g>

  <text class="tick" x="885" y="782" text-anchor="middle">← unrar faster · unrar-rs faster →</text>
</svg>
