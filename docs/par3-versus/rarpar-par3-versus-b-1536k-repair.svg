<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc">
  <title id="title">PAR2 against PAR3: b-1536k, repair</title>
  <desc id="desc">PAR2 (par2-rs, par2cmdline-turbo) and PAR3 (par3cmdline and rarpar par3, Cauchy and FFT) repair of posting shape b-1536k on 2 machine(s). Damage lost-10x1536k-5of10files (10 blocks). 10 x 30 MiB, 1.5 MiB blocks, 10% (200 + 20): the census median block size for releases under 1 GiB, in 30 MiB volumes as anime archive posts use. Relative speed is par2cmdline-turbo median wall time divided by each arm&#39;s median wall time; each row also lists the arm&#39;s CPU time and peak RSS. par3cmdline is single-threaded and the PAR2 tools run at their default thread count. Every repair was checked against the inputs&#39; SHA-256. Arms marked retains file left a numbered .1 copy of every file they repaired, as par2cmdline-turbo and par3cmdline do; arms marked in place wrote none. Only arms with the same mark write the same bytes.</desc>
  <style>
    .bg { fill: #ffffff; } text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; } .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; } .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; } .tick { font-size: 11px; fill: #667085; } .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; } .parity { stroke: #172033; stroke-width: 1.5; } .rule { stroke: #e7eaf0; stroke-width: 1; }
    .cpu { fill: #2563eb; } .gpu { fill: #7c3aed; } .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } text { fill: #e6edf3; } .subtitle, .column, .timing, .tick { fill: #9ca7b5; } .grid { stroke: #30363d; } .parity { stroke: #e6edf3; } .rule { stroke: #21262d; } .cpu { fill: #58a6ff; } .gpu { fill: #bc8cff; } .slower { fill: #f2a65a; } }
  </style>
  <metadata>schema=rarpar-par3-bench-v4; shape=b-1536k; op=repair; baseline=par2cmdline-turbo; inputs=Alder Lake:651cd0b230936bb5a12004764b528af84bb27470c5caf1349ee4b5664bc414eb:1/7, Zen 2:c63b4ff2013eba76e12d626ddfa8c84acf4e44ec6b64090ea5ec69c8a067876f:1/7</metadata>
