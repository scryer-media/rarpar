  <text class="subtitle" x="48" y="75">Damage lost-11x10mb (11 blocks). 1 GiB in one file, 10,000,000-byte blocks, 20% (108 + 22): the par2cmdline-turbo cluster of 10 MB blocks at 20%.</text>
