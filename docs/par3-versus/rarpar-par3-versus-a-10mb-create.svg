    <line class="grid" x1="708.3" y1="121" x2="708.3" y2="520"/><text class="tick" x="708.3" y="538" text-anchor="middle">4x</text>
    <line class="grid" x1="796.7" y1="121" x2="796.7" y2="520"/><text class="tick" x="796.7" y="538" text-anchor="middle">2x</text>
    <line class="parity" x1="885.0" y1="121" x2="885.0" y2="520"/><text class="tick" x="885.0" y="538" text-anchor="middle">1x parity</text>
    <line class="grid" x1="973.3" y1="121" x2="973.3" y2="520"/><text class="tick" x="973.3" y="538" text-anchor="middle">2x</text>
    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="520"/><text class="tick" x="1061.7" y="538" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="520"/><text class="tick" x="1150.0" y="538" text-anchor="middle">8x</text>
