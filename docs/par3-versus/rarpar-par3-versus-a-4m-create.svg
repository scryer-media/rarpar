<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" role="img" aria-labelledby="title desc">
  <title id="title">PAR2 against PAR3: a-4m, create</title>
  <desc id="desc">PAR2 (par2-rs, par2cmdline-turbo) and PAR3 (par3cmdline and rarpar par3, Cauchy and FFT) create of posting shape a-4m on 2 machine(s). Damage lost-13x4m (13 blocks). 1 GiB in one file, 4 MiB blocks, 10% (256 + 26): the census median block size and redundancy. Relative speed is par2cmdline-turbo median wall time divided by each arm&#39;s median wall time; each row also lists the arm&#39;s CPU time and peak RSS. par3cmdline is single-threaded and the PAR2 tools run at their default thread count. Every repair was checked against the inputs&#39; SHA-256.</desc>
  <style>
    .bg { fill: #ffffff; } text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; } .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; } .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; } .tick { font-size: 11px; fill: #667085; } .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; } .parity { stroke: #172033; stroke-width: 1.5; } .rule { stroke: #e7eaf0; stroke-width: 1; }
    .cpu { fill: #2563eb; } .gpu { fill: #7c3aed; } .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } text { fill: #e6edf3; } .subtitle, .column, .timing, .tick { fill: #9ca7b5; } .grid { stroke: #30363d; } .parity { stroke: #e6edf3; } .rule { stroke: #21262d; } .cpu { fill: #58a6ff; } .gpu { fill: #bc8cff; } .slower { fill: #f2a65a; } }
  </style>
  <metadata>schema=rarpar-par3-bench-v4; shape=a-4m; op=create; baseline=par2cmdline-turbo; inputs=Alder Lake:651cd0b230936bb5a12004764b528af84bb27470c5caf1349ee4b5664bc414eb:1/7, Zen 2:c63b4ff2013eba76e12d626ddfa8c84acf4e44ec6b64090ea5ec69c8a067876f:1/7</metadata>
  <rect class="bg" width="1200" height="578"/>
  <text class="title" x="48" y="48">PAR2 against PAR3: a-4m, create</text>
  <text class="subtitle" x="48" y="75">Damage lost-13x4m (13 blocks). 1 GiB in one file, 4 MiB blocks, 10% (256 + 26): the census median block size and redundancy.</text>
  <g aria-label="Legend"><rect class="slower" x="570" y="84" width="14" height="14" rx="2"/><text class="subtitle" x="592" y="96">par2cmdline-turbo faster</text><rect class="cpu" x="890" y="84" width="14" height="14" rx="2"/><text class="subtitle" x="912" y="96">arm faster</text></g>
  <text class="column" x="48" y="112">Machine / arm / median wall, CPU, peak RSS</text>
  <text class="column" x="620" y="112">Speed against par2cmdline-turbo</text>
  <g aria-label="Relative speed axis">
    <line class="grid" x1="620.0" y1="121" x2="620.0" y2="520"/><text class="tick" x="620.0" y="538" text-anchor="middle">8x</text>
    <line class="grid" x1="708.3" y1="121" x2="708.3" y2="520"/><text class="tick" x="708.3" y="538" text-anchor="middle">4x</text>
    <line class="grid" x1="796.7" y1="121" x2="796.7" y2="520"/><text class="tick" x="796.7" y="538" text-anchor="middle">2x</text>
    <line class="parity" x1="885.0" y1="121" x2="885.0" y2="520"/><text class="tick" x="885.0" y="538" text-anchor="middle">1x parity</text>
    <line class="grid" x1="973.3" y1="121" x2="973.3" y2="520"/><text class="tick" x="973.3" y="538" text-anchor="middle">2x</text>
    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="520"/><text class="tick" x="1061.7" y="538" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="520"/><text class="tick" x="1150.0" y="538" text-anchor="middle">8x</text>
    <text class="tick" x="752.5" y="558" text-anchor="middle">par2cmdline-turbo faster</text>
    <text class="tick" x="1017.5" y="558" text-anchor="middle">arm faster</text>
