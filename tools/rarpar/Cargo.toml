[package]
name = "rarpar"
description = "Intelligent RAR/PAR2/PAR3 repair and extraction CLI"
version = "0.6.1"
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "rarpar"
path = "src/main.rs"

[features]
# musl-allocator rides default: it is a provable no-op off musl (see the
# feature's own comment), and on the musl channel — the only distribution
# for true-portable and docker — mimalloc erases the mallocng fault-storm
# tax (measured: channel gap +5.2% -> -2.1% wall geomean).
default = ["runtime", "crypto-aws-lc", "musl-allocator", "sevenz"]
runtime = [
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:par2-rs",
    "dep:par3-rs",
    "dep:unrar-rs",
    "dep:libc",
]
# Crypto backend selection, forwarded to the libraries. `runtime` deliberately
# forwards neither: a build that asks for the runtime without naming a backend
# must fail in `par2-rs`/`unrar-rs` rather than quietly resolve to one. Every
# shipped artifact is built with `crypto-aws-lc`, which the release feature
# audit enforces.
#
# The `dep?/feature` form keeps these features inert when the libraries are not
# linked at all, so naming a backend never drags the runtime in by itself.
crypto-aws-lc = [
    "par2-rs?/crypto-aws-lc",
    "unrar-rs?/crypto-aws-lc",
    "sevenz-turbo?/aws-lc-crypto",
]
crypto-rust = [
    "par2-rs?/crypto-rust",
    "unrar-rs?/crypto-rust",
    "sevenz-turbo?/native-crypto",
]
# 7z support: one-pass archive-and-protect (`rarpar par3 archive`, 7z or ZIP output), PAR-inside for
# 7z and ZIP in the par3cmdline facade, and the 7-Zip command-line facade
# (`7z`/`7za`/`7zz`/`7zr`, or `rarpar 7z ...`) for SABnzbd and NZBGet. The 7z
# codec is sevenz-turbo; the PAR3 side is par3-rs. Neither depends on the
# other: they meet only here.
sevenz = [
    "runtime",
    "dep:sevenz-turbo",
    "dep:blake3",
    "dep:crc-fast",
    "dep:filetime",
    "dep:libc",
    "dep:zip",
]
# musl-only global allocator. The dependency is declared under a
# `cfg(target_env = "musl")` target table, so enabling this feature is a
# provable no-op for every non-musl target: glibc, macOS and Windows builds
# never see the crate, never link it, and keep the system allocator.
musl-allocator = ["dep:mimalloc"]

[dependencies]
par2-rs = { path = "../../crates/par2-rs", version = "=0.10.8", default-features = false, optional = true }
par3-rs = { path = "../../crates/par3-rs", version = "=0.5.0", default-features = false, optional = true }
unrar-rs = { path = "../../crates/unrar-rs", version = "0.11.0", default-features = false, optional = true }
blake3 = { workspace = true, optional = true }
clap = { workspace = true }
crc-fast = { workspace = true, optional = true }
filetime = { workspace = true, optional = true }
sevenz-turbo = { version = "0.26.1", default-features = false, features = [
    "aes256",
    "bzip2",
    "compress",
    "deflate",
    "ppmd",
], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# ZIP output for `rarpar par3 archive --format zip`: stored or deflated
# through flate2's zlib-rs backend, with no encryption.
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
], optional = true }

# The 7-Zip facade prints local times the way 7-Zip does, through the C
# library's time zone conversion.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# Read-ahead advice for the format probes.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
libc = { workspace = true, optional = true }

# musl's mallocng is markedly weaker than glibc's malloc under the
# multithreaded allocation churn rayon generates. Only the musl distribution
# (docker + true-portable static) pays that cost, so only it links a
# replacement.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
