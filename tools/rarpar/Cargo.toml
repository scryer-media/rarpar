[package]
name = "rarpar"
description = "Intelligent RAR/PAR2 repair and extraction CLI"
version = "0.3.0"
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "rarpar"
path = "src/main.rs"

[features]
default = ["runtime"]
runtime = [
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:par2-rs",
    "par2-rs/native-crypto",
    "dep:unrar-rs",
    "unrar-rs/native-crypto",
]
wgpu = ["runtime", "par2-rs/wgpu"]
metal = ["runtime", "par2-rs/metal"]

[dependencies]
par2-rs = { path = "../../crates/weaver-par2", version = "0.3.0", default-features = false, optional = true }
unrar-rs = { path = "../../crates/weaver-unrar", version = "0.4.0", default-features = false, optional = true }
clap = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
