[package]
name = "rarpar"
description = "Intelligent RAR/PAR2 repair and extraction CLI"
version = "0.3.2"
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "rarpar"
path = "src/main.rs"

[features]
# musl-allocator rides default: it is a provable no-op off musl (see the
# feature's own comment), and on the musl channel — the only distribution
# for true-portable and docker — mimalloc erases the mallocng fault-storm
# tax (measured: channel gap +5.2% -> -2.1% wall geomean).
default = ["runtime", "musl-allocator"]
runtime = [
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:par2-rs",
    "par2-rs/native-crypto",
    "dep:unrar-rs",
    "unrar-rs/native-crypto",
]
wgpu = ["runtime", "par2-rs/wgpu"]
metal = ["runtime", "par2-rs/metal"]
# musl-only global allocator. The dependency is declared under a
# `cfg(target_env = "musl")` target table, so enabling this feature is a
# provable no-op for every non-musl target: glibc, macOS and Windows builds
# never see the crate, never link it, and keep the system allocator.
musl-allocator = ["dep:mimalloc"]

[dependencies]
par2-rs = { path = "../../crates/par2-rs", version = "0.4.2", default-features = false, optional = true }
unrar-rs = { path = "../../crates/unrar-rs", version = "0.5.4", default-features = false, optional = true }
clap = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# musl's mallocng is markedly weaker than glibc's malloc under the
# multithreaded allocation churn rayon generates. Only the musl distribution
# (docker + true-portable static) pays that cost, so only it links a
# replacement.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
