[workspace]
members = [
    "crates/reedsolomon-rs",
    "crates/unrar-rs",
    "crates/par2-rs",
    "crates/par3-rs",
    "tools/rarpar",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.4.11"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/scryer-media/rarpar"

[workspace.dependencies]
aes = { version = "0.9", features = ["zeroize"] }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["non-fips"] }
aws-lc-sys = { version = "0.46", default-features = false, features = ["all-bindings"] }
blake2s_simd = { version = "1.0", default-features = false, features = ["std"] }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
cbc = { version = "0.2", features = ["zeroize"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "derive"] }
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
filetime = { version = "0.2.29", default-features = false }
libc = { version = "0.2", default-features = false }
md-5 = { version = "0.11", default-features = false, features = ["alloc"] }
memchr = { version = "2", default-features = false, features = ["std"] }
memmap2 = { version = "0.9", default-features = false }
rayon = { version = "1.12", default-features = false }
rmp-serde = { version = "1.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "rc", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
subtle = { version = "2", default-features = false }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
unicode-normalization = { version = "0.1.25", default-features = false }
windows-sys = { version = "0.61", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false

# Dev and test builds optimise only the crates that dominate test time. Each
# comment gives the measured cost of leaving that crate at opt-level 0 with the
# other overrides in place (local runs on an Apple M5 Max).

# GF(2^8)/GF(2^16) kernels: fixture-tests 85 s instead of 26 s, par2-rs lib tests 12 s instead of 2.4 s.
[profile.dev.package.reedsolomon-rs]
opt-level = 3

# par2-tests 20 s instead of 7 s.
[profile.dev.package.par2-rs]
opt-level = 3

# par3-tests 15 s instead of 6 s. Optimise it only together with reedsolomon-rs: build.rs
# enables the grouped GF(2^16) kernel at this crate's opt-level, and that kernel left
# unoptimised in reedsolomon-rs overflows a pool worker's stack on aarch64.
[profile.dev.package.par3-rs]
opt-level = 3

# PPMd decoding: unrar-rs tests 58 s instead of 24 s under nextest.
[profile.dev.package.ppmd-turbo]
opt-level = 3

# PAR3 and corpus-manifest hashing: par3-tests 36 s instead of 6 s, test-corpus verify 9.1 s instead of 1 s.
[profile.dev.package.blake3]
opt-level = 3

# Deflate in the rarpar CLI tests: par3_archive_zip 16 s instead of 8 s.
[profile.dev.package.zlib-rs]
opt-level = 3

# LZMA in the rarpar CLI tests: xz_cli 3.3 s instead of 0.5 s.
[profile.dev.package.lzma-turbo]
opt-level = 3

# unrar-rs stays at opt-level 0: its hot dependency ppmd-turbo is optimised above, and
# optimising unrar-rs itself would also build its test binaries optimised in every
# unrar-tests shard (a cold unrar-rs test build is 587 CPU-s instead of 69).

# ppmd-turbo 0.2.0 and lzma-turbo 0.10.0 are not published yet: these point
# at their release commits until they are, and are removed then.
[patch.crates-io]
ppmd-turbo = { git = "https://github.com/scryer-media/ppmd-turbo", rev = "a2cfd2f7e8a14c2396472cfcbec6233f38fc337f" }
lzma-turbo = { git = "https://github.com/scryer-media/lzma-turbo", rev = "9692dc792998041d70ef470dcc5fd6a6fa3dc4c5" }
