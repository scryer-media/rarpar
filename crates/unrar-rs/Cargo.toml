[package]
name = "unrar-rs"
description = "RAR archive reading, decompression, and streaming extraction only"
readme = "README.md"
version = "0.10.1"
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
# `fuzz_corpus_regressions.rs` reads the seed corpus with `include_bytes!`, so
# it goes wherever `fuzz/**` goes: shipping it without the corpus would leave a
# published tarball whose `cargo test` cannot compile.
exclude = ["tests/fixtures/**", "fuzz/**", "tests/fuzz_corpus_regressions.rs"]

# Crypto backend selection.
#
# Exactly one backend supplies the AES-CBC / HMAC-SHA256 / SHA-256 seam
# consumed by `crate::crypto`. Precedence: on native (non-wasm) targets the
# AWS-LC backend wins whenever `crypto-aws-lc` is enabled, even if
# `crypto-rust` is also on (both modules still compile, which powers the
# differential tests). On `wasm` targets the AWS-LC deps vanish via a target
# gate, so `crypto-rust` is selected automatically. Enabling neither backend
# (on a target where AWS-LC is unavailable) is a compile error.
[features]
default = ["crypto-aws-lc"]
crypto-aws-lc = ["dep:aws-lc-rs", "dep:aws-lc-sys"]
crypto-rust = ["dep:hmac", "dep:aes", "dep:cbc"]
# Delegate the bulk AES-CBC decrypt to an embedder-installed hook (see the
# `hooks` module) while reusing the RustCrypto KDF primitives in-guest; it
# therefore pulls in `crypto-rust`. Engaged on `wasm32` only: on a native
# target the feature is accepted but inert (AWS-LC or the RustCrypto backend
# stays active and the hook is never called), so feature unification in a
# mixed workspace cannot silently turn a native build into a delegating one.
crypto-host = ["crypto-rust"]
# Delegate the bulk member-data CRC-32 to an embedder-installed hook (see the
# `hooks` module) instead of computing it in-guest with `crc-fast`. Same
# wasm32-only engagement as `crypto-host`; on native targets the
# `crate::crc::Crc32` seam keeps its portable `crc-fast` backend regardless.
# Adds NO new dependency: `crc-fast` is already a normal dep that the
# native/portable seam path (and the header/probe CRCs) use unchanged.
crc-host = []
# Back-compat alias for existing workspace dependency declarations (was a
# no-op); selects the native AWS-LC backend.
native-crypto = ["crypto-aws-lc"]
slow-tests = []
# Exposes `__internals`, the decoder/RAR4 entry points this crate's own benches
# and examples reach for. Off by default and never a dependency's business: it
# is not public API and carries no semver guarantee. The targets that need it
# declare it in `required-features`, so a build without it simply skips them.
unstable-internals = []
# Compile the forensic per-symbol PPMd trace hooks. The hooks remain runtime
# controlled by UNRAR_RS_RAR4_DEBUG_PPM, but ordinary builds carry no trace
# state, branches, counters, or formatting code.
ppmd-debug = []

[dependencies]
reedsolomon-rs = { path = "../reedsolomon-rs", version = "0.4.3", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
crc-fast = { workspace = true }
blake2s_simd = { workspace = true }
# NOT optional and NOT part of a backend: the RAR5 KDF's HMAC-SHA256 runs on
# `sha2` on every backend (see `crypto::kdf_hmac`) so the per-iteration path
# never crosses FFI. `crypto-rust` additionally uses it for its whole seam.
sha2 = { workspace = true }
hmac = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
cbc = { workspace = true, optional = true }
serde = { workspace = true }
rmp-serde = { workspace = true, default-features = false }
rayon = { workspace = true, default-features = false }
tempfile = { workspace = true }
memchr = { workspace = true }
unicode-normalization = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
filetime = { workspace = true }
libc = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-lc-rs = { workspace = true, optional = true }
aws-lc-sys = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
tracing-subscriber.workspace = true

# Criterion pulls in Rayon by default and hard-`compile_error!`s on wasm
# (wasi) targets. Building the `crypto_baseline` example for wasm compiles the
# crate's dev-dependencies, so criterion is scoped to non-wasm targets; the
# `archive_hotspots` bench only runs natively anyway.
#
# The `wasm_host_aes_smoke` and `wasm_host_extract_conformance` integration
# tests drive the wasm `crypto-host` / `crc-host` examples through a native
# `wasmtime` host that supplies the reference host functions the examples
# import. Those deps (wasmtime + WASI preview1 + a RustCrypto reference AES)
# are native-only tooling for that harness and, like criterion, MUST stay off
# the wasm example build — hence this same non-wasm target gate.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.8"
wasmtime = "48"
wasmtime-wasi = "48"
aes = { workspace = true }
cbc = { workspace = true }

# The two wasm guest examples are reference embeddings of the `hooks` seam:
# each declares raw imports in a `host` namespace and installs hooks that
# forward to them. They only make sense with the delegating features on.
[[example]]
name = "host_aes_smoke"
required-features = ["crypto-host"]

[[example]]
name = "wasm_extract_conformance"
required-features = ["crypto-host", "crc-host"]

[[example]]
name = "probe_volumes"
required-features = ["unstable-internals"]

[[bench]]
name = "archive_hotspots"
harness = false
required-features = ["unstable-internals"]

[[bench]]
name = "ppmd_compare"
harness = false
