[package]
name = "unrar-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
unrar-rs = { path = "..", default-features = false, features = ["crypto-rust"] }

[[bin]]
name = "rar_headers"
path = "fuzz_targets/rar_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rar_extract"
path = "fuzz_targets/rar_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rar_recovery_restore"
path = "fuzz_targets/rar_recovery_restore.rs"
test = false
doc = false
bench = false

[workspace]
members = []

# ppmd-turbo 0.2.0 is not published yet. This is its own workspace, so the root
# patch does not reach it: this points at the same release commit until the crate
# is published, and is removed then.
[patch.crates-io]
ppmd-turbo = { git = "https://github.com/scryer-media/ppmd-turbo", rev = "352df40194fc9dcdf0015f8030e4f9cfeef278f5" }
