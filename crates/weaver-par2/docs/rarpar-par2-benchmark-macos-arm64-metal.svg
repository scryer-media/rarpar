    <text class="ratio" x="1058.8" y="280">3.7x</text>
    <line class="rule" x1="48" y1="302" x2="1150" y2="302"/>
    <text class="workload" x="48" y="330">PAR2 heavy repair with 28 damaged slices</text>
    <text class="timing" x="48" y="346">1.07 s -> 349.1 ms</text>
