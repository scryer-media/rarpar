    <text class="ratio" x="1130.4" y="226">6.4x</text>
    <line class="rule" x1="48" y1="248" x2="1150" y2="248"/>
    <text class="workload" x="48" y="276">PAR2 missing-volume repair</text>
    <text class="timing" x="48" y="292">49.1 ms -> 49.0 ms</text>
    <rect class="cpu" x="885.0" y="268" width="0.3" height="14" rx="2"/>
    <text class="ratio" x="893.3" y="280">1.0x</text>
    <line class="rule" x1="48" y1="302" x2="1150" y2="302"/>
    <text class="workload" x="48" y="330">PAR2 verification</text>
    <text class="timing" x="48" y="346">28.0 ms -> 7.2 ms</text>
