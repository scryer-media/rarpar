<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc">
  <title id="title">rarpar PAR2 relative speed benchmark</title>
  <desc id="desc">Measured PAR2 workloads on Apple M5 Max (macOS). Relative speed is reference elapsed time divided by rarpar elapsed time.</desc>
  <style>
    .bg { fill: #ffffff; } text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; } .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; } .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; } .tick { font-size: 11px; fill: #667085; } .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; } .parity { stroke: #172033; stroke-width: 1.5; } .rule { stroke: #e7eaf0; stroke-width: 1; }
    .cpu { fill: #2563eb; } .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } text { fill: #e6edf3; } .subtitle, .column, .timing, .tick { fill: #9ca7b5; } .grid { stroke: #30363d; } .parity { stroke: #e6edf3; } .rule { stroke: #21262d; } .cpu { fill: #58a6ff; } .gpu { fill: #bc8cff; } .slower { fill: #f2a65a; } }
  </style>
  <metadata>schema=1; report_sha256=2470084d9b5b0f067d21c33cb22044b6ceb61caa8c9593561015ce3ac53e42d4; corpus_digest=4eb72799f7e86ca2512740d4827c43f639558d19ff95ac829ccd1780072f7b43; plan_id=plan-1433c7192d351fe6; candidate_sha256=02af7e2321a36631006d72765e4d192f095c1548feab970c2fc7fa5ba1f2e081; rar_reference_sha256=99720d63484b8db77db43477db095f198d52b34515938d4ee7b165c59fa1cbe9; par2_reference_sha256=32ab46c2c023acd61af5dcd793aa0059306ea3e9b75df4b21daa2c6546cb2d0d; lane=cpu; par2_placement=canonical</metadata>
  <rect class="bg" width="1200" height="468"/>
  <text class="title" x="48" y="48">rarpar PAR2 relative speed benchmark</text>
  <text class="subtitle" x="48" y="75">Lower elapsed time is better. Bars show the faster side's multiplier on a symmetric log scale.</text>
  <g aria-label="Legend"><rect class="cpu" x="760" y="39" width="14" height="14" rx="2"/><text class="subtitle" x="782" y="51">rarpar / CPU</text><rect class="slower" x="920" y="39" width="14" height="14" rx="2"/><text class="subtitle" x="942" y="51">par2cmdline-turbo faster</text></g>
  <text class="column" x="48" y="112">Workload / elapsed time</text>
  <text class="column" x="620" y="112">Relative speed</text>
  <g aria-label="Relative speed axis">
    <line class="grid" x1="620.0" y1="121" x2="620.0" y2="410"/><text class="tick" x="620.0" y="428" text-anchor="middle">8x</text>
    <line class="grid" x1="708.3" y1="121" x2="708.3" y2="410"/><text class="tick" x="708.3" y="428" text-anchor="middle">4x</text>
    <line class="grid" x1="796.7" y1="121" x2="796.7" y2="410"/><text class="tick" x="796.7" y="428" text-anchor="middle">2x</text>
    <line class="parity" x1="885.0" y1="121" x2="885.0" y2="410"/><text class="tick" x="885.0" y="428" text-anchor="middle">1x parity</text>
    <line class="grid" x1="973.3" y1="121" x2="973.3" y2="410"/><text class="tick" x="973.3" y="428" text-anchor="middle">2x</text>
    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="410"/><text class="tick" x="1061.7" y="428" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="410"/><text class="tick" x="1150.0" y="428" text-anchor="middle">8x</text>
    <text class="tick" x="752.5" y="448" text-anchor="middle">par2cmdline-turbo faster</text>
    <text class="tick" x="1017.5" y="448" text-anchor="middle">rarpar faster</text>
