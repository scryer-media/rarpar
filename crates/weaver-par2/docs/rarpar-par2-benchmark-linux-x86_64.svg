    <line class="rule" x1="48" y1="194" x2="1150" y2="194"/>
    <text class="workload" x="48" y="222">PAR2 byte-damage repair and extraction</text>
    <text class="timing" x="48" y="238">51.4 ms -> 67.3 ms</text>
    <rect class="slower" x="850.7" y="214" width="34.3" height="14" rx="2"/>
    <text class="ratio" x="842.7" y="226" text-anchor="end">1.3x</text>
    <line class="rule" x1="48" y1="248" x2="1150" y2="248"/>
    <text class="workload" x="48" y="276">PAR2 verification</text>
    <text class="timing" x="48" y="292">14.7 ms -> 7.8 ms</text>
