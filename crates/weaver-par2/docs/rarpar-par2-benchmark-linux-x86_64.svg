<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">rarpar PAR2 relative speed benchmark</title>
  <desc id="desc">Measured PAR2 workloads on Intel Core i5-1240P (Linux). Relative speed is reference elapsed time divided by rarpar elapsed time.</desc>
  <style>
    .bg { fill: #ffffff; } text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; } .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; } .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; } .tick { font-size: 11px; fill: #667085; } .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; } .parity { stroke: #172033; stroke-width: 1.5; } .rule { stroke: #e7eaf0; stroke-width: 1; }
    .cpu { fill: #2563eb; } .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } text { fill: #e6edf3; } .subtitle, .column, .timing, .tick { fill: #9ca7b5; } .grid { stroke: #30363d; } .parity { stroke: #e6edf3; } .rule { stroke: #21262d; } .cpu { fill: #58a6ff; } .gpu { fill: #bc8cff; } .slower { fill: #f2a65a; } }
  </style>
  <metadata>schema=1; report_sha256=6b62065d7e8dfeadf73f99fcc44601310750dbc93a4775efe54f56073cff2c88; corpus_digest=bb7eb7b69e020f23acd1db63856e11875eaabd3731be93f25fc7a363e4832bc5; plan_id=plan-09315796638d8df7-par2; candidate_sha256=8da88224ac4522fc8ad4cc6da9072bbcea20c54d098acd45c84b75738e7d58c4; rar_reference_sha256=926d3a00775ed96afccfdef69c3781334b71ccdb733931edf30f4866e4f08410; par2_reference_sha256=2c3ba0c55336a43ad54a304bcfec1aa11d469989bbc2efbd8de88ae16606c734; lane=cpu; par2_placement=canonical</metadata>
  <rect class="bg" width="1200" height="360"/>
  <text class="title" x="48" y="48">rarpar PAR2 relative speed benchmark</text>
  <text class="subtitle" x="48" y="75">Lower elapsed time is better. Bars show the faster side's multiplier on a symmetric log scale.</text>
  <g aria-label="Legend"><rect class="cpu" x="760" y="39" width="14" height="14" rx="2"/><text class="subtitle" x="782" y="51">rarpar / CPU</text><rect class="slower" x="920" y="39" width="14" height="14" rx="2"/><text class="subtitle" x="942" y="51">par2cmdline-turbo faster</text></g>
  <text class="column" x="48" y="112">Workload / elapsed time</text>
  <text class="column" x="620" y="112">Relative speed</text>
  <g aria-label="Relative speed axis">
    <line class="grid" x1="620.0" y1="121" x2="620.0" y2="302"/><text class="tick" x="620.0" y="320" text-anchor="middle">8x</text>
    <line class="grid" x1="708.3" y1="121" x2="708.3" y2="302"/><text class="tick" x="708.3" y="320" text-anchor="middle">4x</text>
    <line class="grid" x1="796.7" y1="121" x2="796.7" y2="302"/><text class="tick" x="796.7" y="320" text-anchor="middle">2x</text>
    <line class="parity" x1="885.0" y1="121" x2="885.0" y2="302"/><text class="tick" x="885.0" y="320" text-anchor="middle">1x parity</text>
    <line class="grid" x1="973.3" y1="121" x2="973.3" y2="302"/><text class="tick" x="973.3" y="320" text-anchor="middle">2x</text>
    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="302"/><text class="tick" x="1061.7" y="320" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="302"/><text class="tick" x="1150.0" y="320" text-anchor="middle">8x</text>
    <text class="tick" x="752.5" y="340" text-anchor="middle">par2cmdline-turbo faster</text>
    <text class="tick" x="1017.5" y="340" text-anchor="middle">rarpar faster</text>
  </g>
  <g aria-label="PAR2 benchmarks"><text class="machine" x="48" y="140">Intel Core i5-1240P (Linux) / amd64 / cpu / canonical placement</text>
    <text class="workload" x="48" y="168">PAR2 missing-volume repair and extraction</text>
