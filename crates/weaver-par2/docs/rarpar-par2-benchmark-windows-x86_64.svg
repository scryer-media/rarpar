    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="302"/><text class="tick" x="1061.7" y="320" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="302"/><text class="tick" x="1150.0" y="320" text-anchor="middle">8x</text>
    <text class="tick" x="752.5" y="340" text-anchor="middle">par2cmdline-turbo faster</text>
    <text class="tick" x="1017.5" y="340" text-anchor="middle">rarpar faster</text>
