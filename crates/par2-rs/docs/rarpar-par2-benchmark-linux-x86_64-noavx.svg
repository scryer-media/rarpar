<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="522" viewBox="0 0 1200 522" role="img" aria-labelledby="title desc">
  <title id="title">rarpar PAR2 relative speed benchmark</title>
  <desc id="desc">Measured PAR2 workloads on linux-atom-c3538-noavx across 1 execution lane(s). Relative speed is reference elapsed time divided by rarpar elapsed time.</desc>
  <style>
    .bg { fill: #ffffff; } text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; } .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; } .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; } .tick { font-size: 11px; fill: #667085; } .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; } .parity { stroke: #172033; stroke-width: 1.5; } .rule { stroke: #e7eaf0; stroke-width: 1; }
    .cpu { fill: #2563eb; } .gpu { fill: #7c3aed; } .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } text { fill: #e6edf3; } .subtitle, .column, .timing, .tick { fill: #9ca7b5; } .grid { stroke: #30363d; } .parity { stroke: #e6edf3; } .rule { stroke: #21262d; } .cpu { fill: #58a6ff; } .gpu { fill: #bc8cff; } .slower { fill: #f2a65a; } }
  </style>
  <metadata>schema=1; report_sha256=f248194163f4c63009aab6b6e45bf80ab025326285762a7558f4676ba30d8672; corpus_digest=59f46fa58f651958ad8fc035d98a0cf0ce69345b740a1e9cc5fc52ab58929ada; plan_id=plan-900b3c52bca9463e; candidate_sha256=f796ac3b8eeb4270701d2a83e6ca18eaaf453b53a27135e7f882931eccc6017d; reference_sha256=2c3ba0c55336a43ad54a304bcfec1aa11d469989bbc2efbd8de88ae16606c734; lane=cpu; collector=wall-clock; par2_placement=canonical</metadata>
  <rect class="bg" width="1200" height="522"/>
  <text class="title" x="48" y="48">rarpar PAR2 relative speed benchmark</text>
  <text class="subtitle" x="48" y="75">Lower elapsed time is better. Bars show the faster side's multiplier on a symmetric log scale.</text>
  <g aria-label="Legend"><rect class="slower" x="570" y="84" width="14" height="14" rx="2"/><text class="subtitle" x="592" y="96">par2cmdline-turbo faster</text><rect class="cpu" x="890" y="84" width="14" height="14" rx="2"/><text class="subtitle" x="912" y="96">rarpar / CPU</text></g>
  <text class="column" x="48" y="112">Workload / elapsed time</text>
  <text class="column" x="620" y="112">Relative speed</text>
  <g aria-label="Relative speed axis">
    <line class="grid" x1="620.0" y1="121" x2="620.0" y2="464"/><text class="tick" x="620.0" y="482" text-anchor="middle">8x</text>
    <line class="grid" x1="708.3" y1="121" x2="708.3" y2="464"/><text class="tick" x="708.3" y="482" text-anchor="middle">4x</text>
    <line class="grid" x1="796.7" y1="121" x2="796.7" y2="464"/><text class="tick" x="796.7" y="482" text-anchor="middle">2x</text>
    <line class="parity" x1="885.0" y1="121" x2="885.0" y2="464"/><text class="tick" x="885.0" y="482" text-anchor="middle">1x parity</text>
    <line class="grid" x1="973.3" y1="121" x2="973.3" y2="464"/><text class="tick" x="973.3" y="482" text-anchor="middle">2x</text>
    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="464"/><text class="tick" x="1061.7" y="482" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="464"/><text class="tick" x="1150.0" y="482" text-anchor="middle">8x</text>
    <text class="tick" x="752.5" y="502" text-anchor="middle">par2cmdline-turbo faster</text>
    <text class="tick" x="1017.5" y="502" text-anchor="middle">rarpar faster</text>
  </g>
  <g aria-label="PAR2 benchmarks">
    <text class="machine" x="48" y="140">linux-atom-c3538-noavx / amd64 / cpu / canonical placement</text>
    <text class="workload" x="48" y="168">PAR2 verification</text>
    <text class="timing" x="48" y="184">32.4 ms -> 16.7 ms</text>
    <rect class="cpu" x="885.0" y="160" width="84.3" height="14" rx="2"/>
    <text class="ratio" x="977.3" y="172">1.9x</text>
    <line class="rule" x1="48" y1="194" x2="1150" y2="194"/>
    <text class="workload" x="48" y="222">PAR2 byte-damage repair</text>
    <text class="timing" x="48" y="238">58.8 ms -> 35.6 ms</text>
    <rect class="cpu" x="885.0" y="214" width="63.9" height="14" rx="2"/>
    <text class="ratio" x="956.9" y="226">1.7x</text>
    <line class="rule" x1="48" y1="248" x2="1150" y2="248"/>
    <text class="workload" x="48" y="276">PAR2 heavy repair with 28 damaged slices</text>
    <text class="timing" x="48" y="292">1.33 s -> 817.0 ms</text>
    <rect class="cpu" x="885.0" y="268" width="62.5" height="14" rx="2"/>
    <text class="ratio" x="955.5" y="280">1.6x</text>
    <line class="rule" x1="48" y1="302" x2="1150" y2="302"/>
    <text class="workload" x="48" y="330">PAR2 heavy repair with 250 damaged slices</text>
    <text class="timing" x="48" y="346">3.16 s -> 2.50 s</text>
    <rect class="cpu" x="885.0" y="322" width="29.5" height="14" rx="2"/>
    <text class="ratio" x="922.5" y="334">1.3x</text>
    <line class="rule" x1="48" y1="356" x2="1150" y2="356"/>
    <text class="workload" x="48" y="384">PAR2 missing-volume repair</text>
    <text class="timing" x="48" y="400">64.9 ms -> 54.7 ms</text>
    <rect class="cpu" x="885.0" y="376" width="21.8" height="14" rx="2"/>
    <text class="ratio" x="914.8" y="388">1.2x</text>
    <line class="rule" x1="48" y1="410" x2="1150" y2="410"/>
    <text class="workload" x="48" y="438">PAR2 generation from 256 MiB RAR5 multi-volume input</text>
    <text class="timing" x="48" y="454">15.35 s -> 21.71 s</text>
    <rect class="slower" x="840.8" y="430" width="44.2" height="14" rx="2"/>
    <text class="ratio" x="832.8" y="442" text-anchor="end">1.4x</text>
    <line class="rule" x1="48" y1="464" x2="1150" y2="464"/>
  </g>
