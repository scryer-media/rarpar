    <text class="workload" x="48" y="222">PAR2 heavy repair with 250 damaged slices</text>
    <text class="timing" x="48" y="238">2.35 s -> 305.3 ms</text>
    <rect class="gpu" x="885.0" y="214" width="259.9" height="14" rx="2"/>
    <text class="ratio" x="1152.9" y="226">7.7x</text>
    <line class="rule" x1="48" y1="248" x2="1150" y2="248"/>
    <text class="workload" x="48" y="276">PAR2 byte-damage repair</text>
    <text class="timing" x="48" y="292">49.8 ms -> 10.4 ms</text>
    <rect class="cpu" x="885.0" y="268" width="199.7" height="14" rx="2"/>
    <text class="ratio" x="1092.7" y="280">4.8x</text>
    <line class="rule" x1="48" y1="302" x2="1150" y2="302"/>
    <text class="workload" x="48" y="330">PAR2 heavy repair with 28 damaged slices</text>
    <text class="timing" x="48" y="346">1.04 s -> 239.7 ms</text>
    <rect class="gpu" x="885.0" y="322" width="186.5" height="14" rx="2"/>
    <text class="ratio" x="1079.5" y="334">4.3x</text>
    <line class="rule" x1="48" y1="356" x2="1150" y2="356"/>
    <text class="workload" x="48" y="384">PAR2 missing-volume repair</text>
    <text class="timing" x="48" y="400">48.8 ms -> 12.1 ms</text>
    <rect class="cpu" x="885.0" y="376" width="177.2" height="14" rx="2"/>
    <text class="ratio" x="1070.2" y="388">4.0x</text>
    <line class="rule" x1="48" y1="410" x2="1150" y2="410"/>
    <text class="workload" x="48" y="438">PAR2 verification</text>
    <text class="timing" x="48" y="454">28.6 ms -> 7.5 ms</text>
    <rect class="cpu" x="885.0" y="430" width="170.0" height="14" rx="2"/>
    <text class="ratio" x="1063.0" y="442">3.8x</text>
