[package]
name = "par2-rs"
description = "PAR2 parity verification and repair"
readme = "README.md"
version = "0.10.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests/fixtures/**", "fuzz/**"]

# Crypto backend selection.
#
# The MD5 seam in `crate::checksum` has two backends. `crypto-aws-lc` (default)
# binds AWS-LC's MD5 directly; `crypto-rust` selects the portable RustCrypto
# `md-5` implementation. On native targets the AWS-LC backend wins whenever
# `crypto-aws-lc` is enabled, even when `crypto-rust` is also on — both stay
# compiled so the backend differential test can compare them. On `wasm` the
# AWS-LC dependency vanishes through a target gate, so `crypto-rust` is the
# only backend there. Enabling neither backend on a native target is a compile
# error (see `lib.rs`).
#
# On native targets `md-5` is reachable only through `crypto-rust`, so a
# default build links neither the RustCrypto backend nor its crate. On `wasm`
# it is unconditional (see the wasm dependency table): RustCrypto is the only
# backend that exists there, and a featureless wasm build keeps selecting it
# without being asked, as it always has. The test suite still needs an
# independent MD5 to check the AWS-LC binding against, which is why `md-5`
# also appears under `[dev-dependencies]`: consumers never see that edge.
[features]
# `native-crypto` stays in the default list: it was the default feature before
# the backends were named, and a consumer that reached the AWS-LC backend
# through the defaults must keep seeing it enabled.
default = ["crypto-aws-lc", "native-crypto"]
crypto-aws-lc = ["dep:aws-lc-sys"]
crypto-rust = ["dep:md-5"]
# Back-compat alias for dependency declarations written before the backends
# were named; selects the AWS-LC backend.
native-crypto = ["crypto-aws-lc"]
slow-tests = []
# Opt-in Apple-GPU (Metal) acceleration for repair and creation. Off by
# default: repair may fall back to CPU, while creation follows its explicit
# backend policy and admits Metal only when this feature is enabled on Apple
# Silicon.
# Forwards to reedsolomon-rs's `metal` backend.
metal = ["reedsolomon-rs/metal"]
# Opt-in portable-GPU (wgpu: Vulkan/DX12/Metal) streaming-repair arm for the
# platforms the native Metal backend does not cover. Off by default (wgpu is a
# heavy dependency tree); the session engages under the same size gating as
# Metal, and `WEAVER_GF16_WGPU=1` forces it. Forwards to reedsolomon-rs's
# `wgpu` backend.
wgpu = ["reedsolomon-rs/wgpu"]

[dependencies]
reedsolomon-rs = { path = "../reedsolomon-rs", version = "0.4.6", default-features = false }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
crc-fast = { workspace = true }
rayon = { workspace = true, default-features = false }
libc = { workspace = true }

# Native-only dependencies.
#
# `memmap2` backs the mmap scanner in `repairer.rs`; wasip1 has no `mmap`, so
# the scanner takes a compile-time buffered `std::fs` fallback there (see
# `MappedFile` in `repairer.rs`) and the crate must not even link memmap2 on
# wasm. `aws-lc-sys` (the `crypto-aws-lc` MD5 backend) is unavailable on wasm
# and is only reachable through that feature, which is off for wasm builds
# (`--no-default-features --features crypto-rust` selects the RustCrypto `md-5`
# backend); the target gate keeps it out even if the feature is force-enabled
# on a wasm build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
memmap2 = { workspace = true, default-features = false }
aws-lc-sys = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }

# The RustCrypto MD5 is the only backend wasm can have, so it is not optional
# there: a wasm consumer that names no feature still gets a working crate.
[target.'cfg(target_family = "wasm")'.dependencies]
md-5 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Capability-relative path resolution prevents repair destinations from
# escaping the caller-selected working directory through Windows reparse
# points while preserving support for a caller-selected symlinked root.
cap-std = "4.0.3"

[dev-dependencies]
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
# The reference MD5 the checksum tests compare the active backend against,
# and the digest helper the other test modules use; independent of which
# backend the build selected.
md-5 = { workspace = true }

# Native-only dev-dependencies.
#
# `criterion` hard-`compile_error!`s on wasm (wasi) targets, and building the
# `wasm_par2_check` example for wasm compiles the crate's dev-dependencies, so
# it is scoped to non-wasm targets; the `par2_repair` bench only runs natively.
# `unrar-rs` is native test-suite tooling (differential RAR extraction
# checks) and is not needed by the wasm harness, so it stays off the wasm build.
# Deliberately path-only (no `version`): cargo strips path-only
# dev-dependencies from the published manifest, so the crates.io package
# carries no unrar-rs (and no UnRAR license-restriction) reference.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
unrar-rs = { path = "../unrar-rs", default-features = false, features = [
    "crypto-aws-lc",
] }
criterion = "0.8"
# Lets the bench surface the crate's own tier logs under `RUST_LOG` — the only
# way to confirm which compute tier (streaming vs in-memory, CPU vs GPU) a
# workflow A/B actually exercised.
tracing-subscriber.workspace = true

[[bench]]
name = "par2_repair"
path = "benches/par2_repair.rs"
harness = false
