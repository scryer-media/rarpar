<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="792" viewBox="0 0 1200 792" role="img" aria-labelledby="title desc">
  <title id="title">rarpar RAR relative speed benchmark</title>
  <desc id="desc">Measured RAR workloads on AMD Ryzen 5 3600 (Windows) across 1 execution lane(s). Relative speed is reference elapsed time divided by rarpar elapsed time.</desc>
  <style>
    .bg { fill: #ffffff; } text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 600; } .subtitle { font-size: 14px; fill: #667085; }
    .column { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: .04em; text-transform: uppercase; }
    .machine { font-size: 15px; font-weight: 600; } .workload { font-size: 13px; font-weight: 500; }
    .timing { font-size: 12px; fill: #667085; } .tick { font-size: 11px; fill: #667085; } .ratio { font-size: 12px; font-weight: 600; }
    .grid { stroke: #d7dce5; stroke-width: 1; } .parity { stroke: #172033; stroke-width: 1.5; } .rule { stroke: #e7eaf0; stroke-width: 1; }
    .cpu { fill: #2563eb; } .gpu { fill: #7c3aed; } .slower { fill: #d97706; }
    @media (prefers-color-scheme: dark) { .bg { fill: #0d1117; } text { fill: #e6edf3; } .subtitle, .column, .timing, .tick { fill: #9ca7b5; } .grid { stroke: #30363d; } .parity { stroke: #e6edf3; } .rule { stroke: #21262d; } .cpu { fill: #58a6ff; } .gpu { fill: #bc8cff; } .slower { fill: #f2a65a; } }
  </style>
  <metadata>schema=1; report_sha256=b87c37671c856864558b90f01e12ae72dabbfe15f147fbd51f12e173bf9980a4; corpus_digest=01d8079f4979ae5b336d77173a3d91755da630588a5aa3862b348e95d9770a86; plan_id=plan-aebc3c4b619fc6fa; candidate_sha256=c66dbcb57c739489427343bb6c36ef2bc09508ae2e5310bacc9df8367daf98d7; reference_sha256=0d3715001790f0fd18d3e850f947b540530b2d2deb9a2e6a9e84f2ed7b234235; lane=cpu; collector=wall-clock; par2_placement=canonical</metadata>
  <rect class="bg" width="1200" height="792"/>
  <text class="title" x="48" y="48">rarpar RAR relative speed benchmark</text>
  <text class="subtitle" x="48" y="75">Lower elapsed time is better. Bars show the faster side's multiplier on a symmetric log scale.</text>
  <g aria-label="Legend"><rect class="cpu" x="570" y="84" width="14" height="14" rx="2"/><text class="subtitle" x="592" y="96">rarpar / CPU</text><rect class="slower" x="890" y="84" width="14" height="14" rx="2"/><text class="subtitle" x="912" y="96">UnRAR faster</text></g>
  <text class="column" x="48" y="112">Workload / elapsed time</text>
  <text class="column" x="620" y="112">Relative speed</text>
  <g aria-label="Relative speed axis">
    <line class="grid" x1="620.0" y1="121" x2="620.0" y2="734"/><text class="tick" x="620.0" y="752" text-anchor="middle">8x</text>
    <line class="grid" x1="708.3" y1="121" x2="708.3" y2="734"/><text class="tick" x="708.3" y="752" text-anchor="middle">4x</text>
    <line class="grid" x1="796.7" y1="121" x2="796.7" y2="734"/><text class="tick" x="796.7" y="752" text-anchor="middle">2x</text>
    <line class="parity" x1="885.0" y1="121" x2="885.0" y2="734"/><text class="tick" x="885.0" y="752" text-anchor="middle">1x parity</text>
    <line class="grid" x1="973.3" y1="121" x2="973.3" y2="734"/><text class="tick" x="973.3" y="752" text-anchor="middle">2x</text>
    <line class="grid" x1="1061.7" y1="121" x2="1061.7" y2="734"/><text class="tick" x="1061.7" y="752" text-anchor="middle">4x</text>
    <line class="grid" x1="1150.0" y1="121" x2="1150.0" y2="734"/><text class="tick" x="1150.0" y="752" text-anchor="middle">8x</text>
    <text class="tick" x="752.5" y="772" text-anchor="middle">UnRAR faster</text>
    <text class="tick" x="1017.5" y="772" text-anchor="middle">rarpar faster</text>
  </g>
